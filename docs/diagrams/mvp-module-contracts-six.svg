<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1350" viewBox="0 0 1500 1350"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#638b7d" stroke-width="1.5"/></marker></defs><rect width="1500" height="1350" fill="#f3f7f5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="48" font-size="30" fill="#193e35" font-weight="650">需求中心 MVP｜模块架构</text><rect x="45" y="78" width="1410" height="155" rx="15" fill="#fff" stroke="#d5e1da"/><text x="70" y="116" font-size="24" fill="#203f36" font-weight="650">01 需求会话与流程编排</text><text x="70" y="151" font-size="18" fill="#6a8076" font-weight="400">职能：管理需求与上下文；统一编排任务、汇总进度与结果</text><text x="70" y="198" font-size="19" fill="#304b47" font-weight="400">输入：用户对话、资料、操作指令</text><text x="770" y="198" font-size="19" fill="#304b47" font-weight="400">输出：执行任务、流程进度、代码 / 制品 / 报告关联</text><text x="750" text-anchor="middle" y="270" font-size="17" fill="#6d817b" font-weight="400">箭头仅表示「输出 → 输入」的数据流，不表示调用方向</text><rect x="45" y="305" width="465" height="250" rx="15" fill="#fff" stroke="#d5e1da"/><rect x="45" y="325" width="4" height="31" rx="2" fill="#b07926"/><text x="69" y="345" font-size="24" fill="#203f36" font-weight="650">02 开发机管理调度</text><text x="69" y="379" font-size="17" fill="#6a8076" font-weight="400">注册、健康检查、能力匹配与分配</text><path d="M69 397h417" stroke="#e4ece6"/><text x="69" y="430" font-size="16" fill="#b07926" font-weight="650">输入</text><text x="124" y="430" font-size="18" fill="#304b47" font-weight="400">系统 / 工具链 / 资源需求</text><text x="124" y="459" font-size="18" fill="#304b47" font-weight="400">指定开发机 / 需求绑定（可选）</text><text x="69" y="501" font-size="16" fill="#b07926" font-weight="650">输出</text><text x="124" y="501" font-size="18" fill="#304b47" font-weight="400">开发机连接地址、协议、凭据引用</text><text x="124" y="530" font-size="18" fill="#304b47" font-weight="400">开发机 ID、分配标识</text><rect x="690" y="305" width="765" height="250" rx="15" fill="#fff" stroke="#d5e1da"/><rect x="690" y="325" width="4" height="31" rx="2" fill="#168166"/><text x="714" y="345" font-size="24" fill="#203f36" font-weight="650">03 AI 代码开发</text><text x="714" y="379" font-size="17" fill="#6a8076" font-weight="400">Agent 在指定开发机管理工作区、分支，编码、验证与提交</text><path d="M714 397h717" stroke="#e4ece6"/><text x="714" y="430" font-size="16" fill="#168166" font-weight="650">输入</text><text x="769" y="430" font-size="18" fill="#304b47" font-weight="400">原始需求、用户对话、仓库 / 分支、分支创建策略</text><text x="769" y="459" font-size="18" fill="#304b47" font-weight="400">开发机连接信息；同需求复用持久工作区</text><text x="714" y="501" font-size="16" fill="#168166" font-weight="650">输出</text><text x="769" y="501" font-size="18" fill="#304b47" font-weight="400">开发后的代码、需求分支、固定 commit / 快照</text><text x="769" y="530" font-size="18" fill="#304b47" font-weight="400">澄清后的需求、修改说明、开发验证结果</text><rect x="45" y="635" width="465" height="300" rx="15" fill="#fff" stroke="#d5e1da"/><rect x="45" y="655" width="4" height="31" rx="2" fill="#b07926"/><text x="69" y="675" font-size="24" fill="#203f36" font-weight="650">04 设备管理调度</text><text x="69" y="709" font-size="17" fill="#6a8076" font-weight="400">发现、注册、调度；拉起应用与在线交互</text><path d="M69 727h417" stroke="#e4ece6"/><text x="69" y="760" font-size="16" fill="#b07926" font-weight="650">输入</text><text x="124" y="760" font-size="18" fill="#304b47" font-weight="400">设备地址 / 类型、设备需求</text><text x="124" y="789" font-size="18" fill="#304b47" font-weight="400">应用标识、拉起 / 查看 / 操作指令</text><text x="69" y="835" font-size="16" fill="#b07926" font-weight="650">输出</text><text x="124" y="835" font-size="18" fill="#304b47" font-weight="400">设备连接、占用凭证、应用拉起结果</text><text x="124" y="864" font-size="18" fill="#304b47" font-weight="400">应用 / 设备在线查看与操作入口</text><text x="69" y="908" font-size="16" fill="#728278" font-weight="400">真机 / 模拟器；开发预览与测试独立占用</text><rect x="690" y="635" width="765" height="360" rx="15" fill="#fff" stroke="#d5e1da"/><rect x="690" y="655" width="4" height="31" rx="2" fill="#7260a5"/><text x="714" y="675" font-size="24" fill="#203f36" font-weight="650">05 制品构建、管理与部署｜适合各平台独立开发</text><text x="714" y="709" font-size="17" fill="#6a8076" font-weight="400">构建 SDK / Demo；制品管理；下载、校验与安装</text><path d="M714 727h717" stroke="#e4ece6"/><text x="714" y="760" font-size="16" fill="#7260a5" font-weight="650">输入</text><text x="769" y="760" font-size="18" fill="#304b47" font-weight="400">构建：仓库分支 / tag、构建配置</text><text x="769" y="789" font-size="18" fill="#304b47" font-weight="400">部署：设备连接、制品 ID / 下载地址、安装方式</text><text x="714" y="859" font-size="16" fill="#7260a5" font-weight="650">输出</text><text x="769" y="859" font-size="18" fill="#304b47" font-weight="400">制品下载地址、ID / 校验值、构建日志地址</text><text x="769" y="888" font-size="18" fill="#304b47" font-weight="400">安装结果、已安装应用实例、实际制品标识</text><text x="769" y="917" font-size="18" fill="#304b47" font-weight="400">各构建阶段进度、下载 / 校验 / 安装结果</text><rect x="690" y="1070" width="765" height="230" rx="15" fill="#fff" stroke="#d5e1da"/><rect x="690" y="1090" width="4" height="31" rx="2" fill="#168166"/><text x="714" y="1110" font-size="24" fill="#203f36" font-weight="650">06 自动化测试｜适合各平台独立开发</text><text x="714" y="1144" font-size="17" fill="#6a8076" font-weight="400">原始用例转换、执行断言、证据采集、AI 报告总结</text><path d="M714 1162h717" stroke="#e4ece6"/><text x="714" y="1193" font-size="16" fill="#168166" font-weight="650">输入</text><text x="769" y="1193" font-size="18" fill="#304b47" font-weight="400">可执行用例集、已安装应用实例、设备连接、端类型</text><text x="714" y="1233" font-size="16" fill="#168166" font-weight="650">输出</text><text x="769" y="1233" font-size="18" fill="#304b47" font-weight="400">原始用例 / 步骤详情与证据、测试报告、AI 总结</text><text x="714" y="1273" font-size="17" fill="#6a8076" font-weight="400">原始用例 → 可执行用例集；需要启动应用时使用 04 的能力</text><path d="M510 430H682" fill="none" stroke="#638b7d" stroke-width="2.2" marker-end="url(#a)"/><text x="600" text-anchor="middle" y="414" font-size="16" fill="#638b7d" font-weight="400">开发机连接</text><path d="M1072 555V627" fill="none" stroke="#638b7d" stroke-width="2.2" marker-end="url(#a)"/><text x="1092" y="599" font-size="16" fill="#638b7d" font-weight="400">固定代码</text><path d="M510 790H682" fill="none" stroke="#638b7d" stroke-width="2.2" marker-end="url(#a)"/><text x="600" text-anchor="middle" y="774" font-size="16" fill="#638b7d" font-weight="400">设备连接</text><path d="M1072 995V1062" fill="none" stroke="#638b7d" stroke-width="2.2" marker-end="url(#a)"/><text x="1092" y="1037" font-size="16" fill="#638b7d" font-weight="400">已安装应用实例</text><rect x="45" y="970" width="465" height="360" rx="15" fill="#fff" stroke="#d5e1da"/><rect x="45" y="990" width="4" height="31" rx="2" fill="#168166"/><text x="69" y="1010" font-size="24" fill="#203f36" font-weight="650">07 产品发布</text><path d="M69 1032h417" stroke="#e4ece6"/><text x="69" y="1066" font-size="16" fill="#168166" font-weight="650">输入</text><text x="124" y="1066" font-size="18" fill="#304b47">测完的仓库 / 分支 / Tag</text><text x="124" y="1097" font-size="18" fill="#304b47">制品下载地址</text><text x="124" y="1128" font-size="18" fill="#304b47">澄清后的需求内容</text><text x="124" y="1159" font-size="18" fill="#304b47">测试报告与测试结论</text><text x="69" y="1201" font-size="16" fill="#168166" font-weight="650">输出</text><text x="124" y="1201" font-size="18" fill="#304b47">开发者文档、API 文档</text><text x="124" y="1232" font-size="18" fill="#304b47">示例 Demo</text><text x="124" y="1263" font-size="18" fill="#304b47">可体验的应用</text><text x="124" y="1294" font-size="18" fill="#304b47">变更日志</text><path d="M690 1175H518" fill="none" stroke="#638b7d" stroke-width="2.2" marker-end="url(#a)"/><text x="600" text-anchor="middle" y="1133" font-size="16" fill="#638b7d">测试报告</text><text x="600" text-anchor="middle" y="1156" font-size="16" fill="#638b7d">与测试结论</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1016" viewBox="0 0 1440 1016" role="img" aria-labelledby="title desc">
  <title id="title">Forge 需求中心 MVP 技术架构</title>
  <desc id="desc">浏览器访问模块化控制服务，统一调度网关调度独立执行节点；Pi 使用共享工作区、Git 和云真机预览。构建和系统测试采用固定输入，测试设备与预览设备分开。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#577c70" stroke-width="1.5"/></marker>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#203a32}
      .title{font-size:30px;font-weight:700}.section{font-size:20px;font-weight:650}.label{font-size:17px;font-weight:600}.body{font-size:15px}.small{font-size:14px;fill:#60756d}
      .panel{fill:#fff;stroke:#d1ded8;stroke-width:1.5}.block{fill:#f4f8f6;stroke:#d5e2dc;stroke-width:1.2}.arrow{fill:none;stroke:#577c70;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1016" fill="#f4f7f5"/>
  <text x="44" y="54" class="title">Forge · 需求中心 MVP 技术架构</text>
  <text x="44" y="85" class="body">一个需求 · 持久共享工作区 / 需求分支 · 多会话并发 · AI 自主提交 · 固定输入验证</text>
  <text x="1396" y="54" text-anchor="end" class="small">设计评审稿 / 2026-09-23</text>

  <rect x="44" y="118" width="1352" height="108" rx="14" class="panel"/>
  <text x="68" y="152" class="section">浏览器工作台</text>
  <text x="68" y="187" class="body">统一需求池 → 概览 / 需求开发 / 制品管理 / 测试</text>
  <rect x="778" y="139" width="590" height="66" rx="9" fill="#e6f1eb"/>
  <text x="798" y="166" class="label">小窗 · 新页面 · 开发桌面</text>
  <text x="798" y="190" class="small">页面只是订阅者；人和 AI 共同操作，无接管切换</text>
  <path d="M450 226V270" class="arrow"/>
  <text x="465" y="255" class="small">REST / SSE</text>
  <path d="M1368 226H1416V592H1404" class="arrow"/>
  <text x="1194" y="250" class="small">独立媒体 / 输入通道</text>

  <rect x="44" y="278" width="880" height="270" rx="14" class="panel"/>
  <text x="68" y="313" class="section">平台控制服务 · 模块化单体</text>
  <text x="900" y="313" text-anchor="end" class="small">不执行源码，不直接调用 LLM</text>
  <rect x="68" y="333" width="258" height="83" rx="9" class="block"/>
  <text x="85" y="363" class="label">需求 / 会话 / 资料</text>
  <text x="85" y="391" class="small">说明修订、独立上下文、引用</text>
  <rect x="342" y="333" width="268" height="83" rx="9" class="block"/>
  <text x="359" y="363" class="label">构建 / 制品 / 测试报告</text>
  <text x="359" y="391" class="small">固定输入、原始证据、AI 总结</text>
  <rect x="626" y="333" width="274" height="83" rx="9" class="block"/>
  <text x="643" y="363" class="label">工程配置 / 外部适配</text>
  <text x="643" y="391" class="small">仓库、配方、用例、环境</text>
  <rect x="68" y="433" width="832" height="88" rx="9" fill="#196a51"/>
  <text x="89" y="466" style="fill:#fff;font-size:20px;font-weight:650">Agent 统一调度网关</text>
  <text x="89" y="496" style="fill:#e1f0e7;font-size:15px">持久 Job · 能力匹配 · 节点分配 · 租约 / 取消 / 恢复 · 执行与证据关联</text>

  <rect x="972" y="278" width="424" height="270" rx="14" class="panel"/>
  <text x="996" y="313" class="section">持久数据</text>
  <rect x="996" y="333" width="158" height="88" rx="9" class="block"/>
  <text x="1011" y="362" class="label">PostgreSQL</text>
  <text x="1011" y="389" class="small">业务 / Job / 事件</text>
  <text x="1011" y="410" class="small">租约 / outbox</text>
  <rect x="1210" y="333" width="162" height="88" rx="9" class="block"/>
  <text x="1225" y="362" class="label">对象存储</text>
  <text x="1225" y="389" class="small">快照 / 附件 / 包</text>
  <text x="1225" y="410" class="small">文档 / 测试证据</text>
  <text x="996" y="460" class="body">内容不可变，引用与执行输入可追溯</text>
  <text x="996" y="491" class="small">节点本地缓存可重建</text>
  <text x="996" y="517" class="small">共享草稿 ≠ Git 提交 ≠ 候选包</text>
  <path d="M924 358H964" class="arrow"/>

  <path d="M450 548V591" class="arrow"/>
  <text x="465" y="577" class="small">命令 / 租约 / 事件回传</text>
  <rect x="44" y="600" width="880" height="232" rx="14" class="panel"/>
  <text x="68" y="635" class="section">独立执行节点 · 源码执行与控制服务隔离</text>
  <rect x="68" y="654" width="258" height="150" rx="9" class="block"/>
  <text x="85" y="685" class="label">会话执行 Agent / Pi</text>
  <text x="85" y="715" class="body">模型与工具循环</text>
  <text x="85" y="744" class="small">每会话上下文独立</text>
  <text x="85" y="773" class="small">代码修改 / 开发验证 / 决策</text>
  <rect x="342" y="654" width="268" height="150" rx="9" class="block"/>
  <text x="359" y="685" class="label">共享工作区 / Git 管理</text>
  <text x="359" y="715" class="body">受管理修改 → 原子发布</text>
  <text x="359" y="744" class="small">固定源码快照 / AI 自主提交</text>
  <text x="359" y="773" class="small">冲突协调，不锁住整段执行</text>
  <rect x="626" y="654" width="274" height="150" rx="9" class="block"/>
  <text x="643" y="685" class="label">构建 / 测试执行器</text>
  <text x="643" y="715" class="body">SDK / Demo / API 文档</text>
  <text x="643" y="744" class="small">Appium / 脚本 / 步骤 / 证据</text>
  <text x="643" y="773" class="small">固定输入与独立执行容器</text>

  <rect x="972" y="572" width="424" height="260" rx="14" class="panel"/>
  <text x="996" y="610" class="section">预览接入 / DeviceProvider</text>
  <text x="996" y="641" class="body">STF 优先验证；DeviceHub 备选</text>
  <rect x="996" y="664" width="178" height="74" rx="9" fill="#e6f1eb"/>
  <text x="1012" y="695" class="label">共享预览真机</text>
  <text x="1012" y="721" class="small">同需求 / 多窗口 / AI</text>
  <rect x="1190" y="664" width="182" height="74" rx="9" fill="#fff0d7"/>
  <text x="1206" y="695" class="label">独立系统测试真机</text>
  <text x="1206" y="721" class="small">固定候选包 / 无人干扰</text>
  <text x="996" y="773" class="small">设备宿主机 + 物理 Android 设备</text>
  <text x="996" y="804" class="small">另一路：Guacamole → 同需求开发桌面</text>
  <path d="M924 716H964" class="arrow"/>

  <path d="M198 832V870" class="arrow"/>
  <path d="M476 832V870" class="arrow"/>
  <rect x="44" y="879" width="1352" height="93" rx="14" class="panel"/>
  <text x="68" y="914" class="section">外部系统</text>
  <text x="223" y="914" class="label">LLM 服务</text>
  <text x="423" y="914" class="label">Git 仓库 / 需求分支</text>
  <text x="709" y="914" class="label">MeterSphere / 用例来源</text>
  <text x="1049" y="914" class="label">业务测试环境</text>
  <text x="68" y="945" class="small">主干合并保留在外部 Git 流程。图示为逻辑责任；不含产品版本、发布、人工验收或用户权限模块。</text>
  <text x="44" y="1000" class="small">实线为主要交互。完整 API、故障恢复和待验证条件见技术架构正文；此图不代表已部署系统。</text>
</svg>

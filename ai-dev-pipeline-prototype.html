display:block}.sidebar{height:auto;position:static;padding:17px}.workspace,.sidebar-footer,.nav-label{display:none}.brand{font-size:22px}.nav{display:flex;overflow:auto;margin-top:15px;gap:3px}.nav button{white-space:nowrap;padding:9px;font-size:12px}.nav button span{display:none}.topbar{height:50px;font-size:11px}.topbar .avatar{display:none}.heading{align-items:flex-start;flex-direction:column}h1{font-size:24px}.stats{grid-template-columns:1fr 1fr}.stat{padding:15px}.stat:nth-child(2){border:0}.stat b{font-size:25px}.platforms,.board,.delivery{grid-template-columns:1fr}.steps{overflow:auto}.step{min-width:82px}.section-head{align-items:flex-start;gap:12px;flex-direction:column}.search{width:100%}.composer-footer{align-items:flex-start;flex-direction:column}.switcher{gap:0;max-width:96vw}.switcher small{display:none}.switcher button{font-size:11px;padding:9px}.variant-B .sidebar{display:block;padding:17px}.variant-B .nav{flex-wrap:nowrap}.content{padding:22px 16px 110px}.panel{padding:18px}.meta{gap:15px}.variant-C h1{font-size:29px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages=['需求确认','AI 开发','构建应用','自动测试','审批发布','已发布'];
const tasks=[{id:'CHG-0286',title:'在游戏启动页增加网络质量提示',platform:'Android',stage:4,type:'需求',time:'今天 14:32',desc:'当网络延迟超过 80ms 时，在启动页显示弱网提示，用户可以继续进入游戏。',tests:36},{id:'BUG-0094',title:'修复横屏切换后虚拟按键偏移',platform:'Web',stage:3,type:'缺陷',time:'今天 13:48',desc:'修复横屏切换后右侧按键偏移，保留用户自定义布局。',tests:24},{id:'CHG-0285',title:'优化连接失败后的重试文案',platform:'Android',stage:5,type:'需求',time:'昨天 17:20',desc:'连接失败后显示清晰的重试入口与原因。',tests:18},{id:'CHG-0284',title:'增加 SDK 版本信息展示',platform:'Windows',stage:1,type:'需求',time:'今天 11:06',desc:'在设置页面展示当前 SDK 版本，方便反馈问题。',tests:12}];
const params=new URLSearchParams(location.search);const state={variant:['A','B','C'].includes(params.get('variant'))?params.get('variant'):'A',page:'home',selected:tasks[0].id,filter:'全部',search:'',attachment:'',previewOn:false};let toastTimer;
const current=()=>tasks.find(t=>t.id===state.selected)||tasks[0];const badge=t=>'<span class="badge '+(t.stage===5?'':t.stage===4?'amber':'gray')+'">'+stages[t.stage]+'</span>';
function toast(s){$('#toast').className='toast';$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').className='';$('#toast').textContent=''},3300)}
function nav(page){state.page=page;render();window.scrollTo(0,0)}
function selectTask(id,page='detail'){state.selected=id;nav(page)}
function heading(k,title,sub,action=''){if(k.startsWith('VERSION / ')){const v=V();return '<div class="version-heading"><div class="version-identity"><h1>'+esc(title)+'</h1><span class="badge">'+statusV(v)+'</span><small class="muted" title="需求范围修订">r'+v.rev+'</small></div><div class="row"><span class="badge gray">原型</span>'+vbutton('back','返回版本列表')+'</div></div>'}return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p>'+sub+'</p></div>'+action+'</div>'}
function composer(){return '<div class="panel hero"><div><div class="row"><span class="badge">✦ 从想法开始</span><small style="color:var(--muted)">需求 · 缺陷 · 体验改进</small></div><h2 style="font-size:23px;margin-top:17px">今天，你想让应用变得怎样？</h2><div class="composer"><textarea id="request" aria-label="需求描述" placeholder="例如：在游戏启动页增加网络质量提示，延迟超过 80ms 时提醒用户…"></textarea><div class="composer-footer"><div class="row"><button class="small" data-action="voice">♩ 口述示例</button><button class="small" data-action="attach">＋ 附件</button><select id="platform" aria-label="目标平台"><option>Android</option><option>Web</option><option>iOS</option><option>Windows</option><option>macOS</option></select></div><button class="primary" data-action="create">生成需求卡 ↗</button></div></div><div class="source" id="attachment">先确认验收标准，再进入开发。语音与构建均为原型演示。</div></div><aside class="guide"><div class="eyebrow">IDEA → DELIVERY</div><strong>每一次交付<br>都有据可查。</strong><p>需求、代码、应用、测试与发布<br>在同一条记录中相遇。</p><span class="badge">内部试点 · Android SDK</span></aside></div>'}
function stats(){return '<div class="stats">'+[['进行中',tasks.filter(t=>t.stage<4).length,'任务正在开发或验证'],['等待验收',tasks.filter(t=>t.stage===4).length,'可体验应用已准备好'],['已交付',tasks.filter(t=>t.stage===5).length,'内部测试渠道'],['自动化用例',tasks.reduce((a,t)=>a+t.tests,0),'示例用例 · 各版本独立执行']].map(a=>'<div class="stat"><small>'+a[0]+'</small><b>'+a[1]+'</b><small>'+a[2]+'</small></div>').join('')+'</div>'}
function rows(){const filtered=tasks.filter(t=>(state.filter==='全部'||(state.filter==='待验收'?t.stage===4:t.type==='缺陷'))&&(t.title+t.id).toLowerCase().includes(state.search.toLowerCase()));return '<div class="table-wrap"><table><thead><tr><th>需求 / 缺陷</th><th>平台</th><th>当前阶段</th><th>测试</th><th>更新时间</th><th></th></tr></thead><tbody>'+filtered.map(t=>'<tr><td><button class="link" data-task="'+t.id+'"><strong>'+esc(t.title)+'</strong></button><small>'+t.id+' · '+t.type+'</small></td><td>'+t.platform+'</td><td>'+badge(t)+'</td><td>'+(t.stage>=4?'<span style="color:var(--green)">✓ '+t.tests+' / '+t.tests+'</span>':'等待执行')+'</td><td>'+t.time+'</td><td><button class="small" data-task="'+t.id+'">查看 →</button></td></tr>').join('')+'</tbody></table>'+(filtered.length?'':'<div class="empty">没有匹配记录</div>')+'</div>'}
function list(){return '<div class="section-head"><h2>变更记录 <span class="badge gray">'+tasks.length+'</span></h2><div class="row"><div class="filters">'+['全部','待验收','缺陷'].map(f=>'<button class="small '+(state.filter===f?'active':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'</div><input class="search" aria-label="搜索变更" placeholder="搜索需求或编号" value="'+esc(state.search)+'" id="search"></div></div><div id="records">'+rows()+'</div>'}
function board(){return '<div class="board">'+[['待确认',[0]],['开发与验证',[1,2,3]],['待验收',[4]],['已交付',[5]]].map(([label,ss])=>'<section class="lane"><h3>'+label+' <span>'+tasks.filter(t=>ss.includes(t.stage)).length+'</span></h3>'+tasks.filter(t=>ss.includes(t.stage)).map(t=>'<article class="ticket"><div class="eyebrow">'+t.id+'</div><h3 style="margin-top:12px">'+esc(t.title)+'</h3><p>'+t.platform+' · '+t.type+'</p>'+badge(t)+'<button class="small" data-task="'+t.id+'">打开任务 →</button></article>').join('')+'</section>').join('')+'</div>'}
function home(){let intro=heading('WORKSPACE / OVERVIEW','把想法，交付成应用。','从一句需求到一次可信交付，所有进展都在这里。','<button data-page="artifacts">打开交付中心 ↗</button>');if(state.variant==='B')return intro+composer()+board();if(state.variant==='C')return intro+'<div class="delivery"><div class="panel"><div class="eyebrow">DELIVERY JOURNAL / 2026.09</div><div class="big-number">'+String(tasks.filter(t=>t.stage===5).length).padStart(2,'0')+'</div><h2>已归档的可信交付</h2><p>以需求为起点，以可体验的应用和完整的验证记录为终点。</p><button data-page="audit">翻阅交付档案 →</button></div><div class="panel"><h2>接下来，需要你确认</h2>'+tasks.filter(t=>t.stage===4).map(t=>'<div class="check"><div><strong>'+esc(t.title)+'</strong><p>'+t.platform+' · '+t.tests+' 项验证通过</p></div><button class="small" data-task="'+t.id+'">验收</button></div>').join('')+'</div></div>'+composer()+list();return intro+composer()+stats()+list()}

ults:t.stage>=4?{passed:t.tests,simulated:true}:null,release:t.stage===5?{channel:'internal-demo',simulated:true}:null});return}if(a==='diff'){openModal('PR #128 · 示例代码差异','<p>下面是预置示例，不是 AI 针对当前需求生成的真实代码。</p><div class="log"><em>demo/NetworkHint.tsx</em><br>+ const showHint = latencyMs &gt; 80;<br>+ return showHint ? &lt;NetworkHint /&gt; : null;<br><br><em>tests/network-hint.spec.ts</em><br>+ expect(visibleAt(81)).toBe(true);<br>+ expect(visibleAt(80)).toBe(false);</div>');return}if(a==='preview'){state.previewOn=false;openModal('应用体验 · '+t.platform+' / 模拟','<div class="preview"><div class="row between"><strong>CLOUD PLAY</strong><span class="badge">SDK DEMO</span></div><div class="preview-game">云端，无限可能</div><p id="network-hint">网络状态良好 · 延迟 24ms</p><button data-action="network">切换弱网状态</button><button style="margin-left:8px" data-action="play">进入游戏（模拟）</button></div><p>交互示意，未运行真实 SDK 或云游戏会话。</p>');return}if(a==='network'){state.previewOn=!state.previewOn;$('#network-hint').textContent=state.previewOn?'⚠ 网络延迟 126ms，可能影响游戏体验，你仍可继续。':'网络状态良好 · 延迟 24ms';return}if(a==='play'){toast('演示：已进入游戏，当前没有连接真实会话');return}if(a==='sync'){openModal('MeterSphere · 同步记录','<span class="badge gray">模拟连接</span><div class="meta"><div><span>计划</span><strong>PLAN-0286</strong></div><div><span>状态</span><strong>'+(t.stage>=4?'已同步并读回（模拟）':'等待测试')+'</strong></div></div><div class="log">source: '+t.id+'<br>idempotency_key: demo/'+t.id+'/run-1<br>project: cloud-game-sdk<br>results: '+(t.stage>=4?t.tests:0)+'<br>readback: '+(t.stage>=4?'matched (SIMULATED)':'pending')+'</div><p>正式接入后展示服务端执行结果与对账记录。</p>');return}if(a==='publish'){if(t.stage!==4)return;if([...document.querySelectorAll('.approval')].some(x=>!x.checked)){toast('请先完成四项演示确认');return}t.stage=5;render();toast('模拟发布完成，交付记录已进入档案');return}if(a==='reject'){if(t.stage!==4)return;t.stage=1;render();toast('已退回 AI 开发，旧验证结论需重新执行');return}}

function traceWork(){if(vs.page==='requirement'){const r=R(vs.requirement);return r?{id:r.id,req:r.id,platform:'跨平台共享',version:null,status:'待排期'}:null}const ws=W(V());return ws.find(w=>w.id===trace.task)||ws[0]}
document.addEventListener('click',e=>{const button=e.target.closest('[data-open-clarification]');if(!button)return;const w=work.find(w=>w.id===button.dataset.openClarification);if(!w)return;if(!w.version){openSharedRequirement(w.req);return}vs.version=w.version;vs.page='version';vs.tab='需求开发';trace.task=w.id;history.replaceState(null,'','#/versions/'+w.version+'/clarification/'+w.id);render()});
function traceNav(){return '<div class="version-tabs">'+['概览','需求开发','提交记录','制品管理','测试'].map(t=>'<button data-vtab="'+t+'" class="'+(vs.tab===t?'active':'')+'">'+t+'</button>').join('')+'</div>'}
function taskPicker(){return '<aside class="trace-list">'+W(V()).map(w=>'<button data-trace-task="'+w.id+'" class="'+(traceWork()?.id===w.id?'active':'')+'"><small>'+w.id+' / '+w.req+'</small>'+esc(R(w.req).title)+'<small>'+w.platform+' · '+w.status+'</small></button>').join('')+'</aside>'}
function specFor(w){const r=R(w.req);if(w.version&&versions.find(v=>v.id===w.version)?.published&&w.spec)return w.spec;if(!r.spec)r.spec=w.spec||{revision:1,confirmed:false,answers:{},history:[]};return r.spec}
function activeSession(s){if(!s.sessions?.length){s.sessions=[{id:'chat-1',title:'需求讨论',messages:s.messages||[],chatDraft:s.chatDraft||'',chatStarted:!!s.chatStarted,specCollapsed:!!s.specCollapsed}];s.activeSessionId='chat-1'}return s.sessions.find(c=>c.id===s.activeSessionId)||s.sessions[0]}
function sessionList(s){const current=activeSession(s);return '<aside class="requirement-sessions" aria-label="需求会话"><h3>需求会话</h3><button data-session-new>＋ 新会话</button><p class="trace-note">独立对话 · 共用需求说明</p>'+s.sessions.map(c=>'<button data-session-select="'+c.id+'" aria-pressed="'+(c.id===current.id)+'" class="'+(c.id===current.id?'active':'')+'"><strong>'+esc(c.title)+'</strong><small>'+c.messages.filter(m=>m.role==='user').length+' 条消息'+(c.chatDraft?' · 有草稿':'')+'</small></button>').join('')+'</aside>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-session-new],[data-session-select]');if(!b)return;const w=traceWork();if(!w)return;const s=specFor(w),c=activeSession(s);c.chatDraft=$('#requirement-message')?.value||'';if('sessionNew'in b.dataset){const id='chat-'+(s.sessions.length+1);s.sessions.push({id,title:'新会话 '+(s.sessions.length+1),messages:[],chatDraft:'',chatStarted:false,specCollapsed:false});s.activeSessionId=id}else s.activeSessionId=b.dataset.sessionSelect;render()});
function requirementContext(){const w=traceWork();return (w?.version&&versions.find(v=>v.id===w.version))||{platform:'统一需求池',name:'',published:false}}
function changeSharedRequirement(w,reason){R(w.req).updatedAt=new Date().toISOString();const related=work.filter(x=>x.req===w.req);related.filter(x=>versions.find(v=>v.id===x.version)?.published).forEach(x=>{if(!x.spec)x.spec=JSON.parse(JSON.stringify(R(w.req).spec))});new Set(related.map(x=>x.version).filter(Boolean)).forEach(id=>{const v=versions.find(v=>v.id===id);if(v&&!v.published)changed(v,reason)})}

document.addEventListener('click',e=>{const b=e.target.closest('[data-requirement-detail]');if(b)openSharedRequirement(b.dataset.requirementDetail);if(e.target.closest('[data-requirement-pool]')){vs.page='pool';history.replaceState(null,'','#/requirements');render()}});
function agentSpecChanges(w){const s=specFor(w);return s.adjustments?.length?'<div class="notice"><strong>对话补充 / 调整 · SPEC v'+s.revision+'</strong>'+s.adjustments.map((m,i)=>'<p style="white-space:pre-wrap">'+(i+1)+'. '+esc(m)+'</p>').join('')+'<p class="trace-note">已记录修改指令；当前未接入 AI，尚未自动整理或解决冲突。</p></div>':''}
function coreUAT(w){if(w.req!=='REQ-101')return '<p>待需求开发后，生成少量产品核心验收场景。</p>';const cases=[
 ['正常使用不受打扰','正常网络下打开启动页','不出现弱网提示，原有启动体验不变。'],
 ['弱网风险清楚可见','弱网下打开启动页','能看懂网络可能影响体验的提示。'],

 ];return '<div class="table-wrap"><table class="trace-table"><thead><tr><th>产品验收场景</th><th>体验方式</th><th>通过标准</th></tr></thead><tbody>'+cases.map(c=>'<tr><td><strong>'+c[0]+'</strong></td><td>'+c[1]+'</td><td>'+c[2]+'</td></tr>').join('')+'</tbody></table></div>'}
function initialClarification(w){const r=R(w.req),s=specFor(w);return '<div class="panel"><div class="trace-title"><div><div class="trace-kicker">'+r.id+'</div><h2>'+esc(r.title)+'</h2></div><span class="badge amber">待 AI 澄清</span></div><div class="quote">'+esc(r.desc||r.title)+'</div><div class="trace-actions">'+(vs.page==='requirement'?work.filter(x=>x.req===r.id&&x.version).map(x=>'<button class="small" data-open-clarification="'+x.id+'">'+x.platform+' · '+versions.find(v=>v.id===x.version).name+' →</button>').join(''):'')+'</div><div style="margin:16px 0;line-height:1.8"><strong>先确认 3 个关键点，再逐步细化</strong><p style="margin:8px 0"><strong>Q1 · 解决什么问题？</strong> 谁在什么场景遇到什么不便？<br><span class="muted">建议：先选一个主要使用者和一个最重要的问题。</span></p><p style="margin:8px 0"><strong>Q2 · 这次做到哪里？</strong> 哪个行为必须实现，有哪些明确不做或不能改变？<br><span class="muted">建议：先完成一个核心流程，其他能力留待后续。</span></p><p style="margin:8px 0"><strong>Q3 · 怎样算做好？</strong> 你看到什么结果，就会认为这个需求完成了？<br><span class="muted">建议：用“当我……，系统应该……”描述一个可检查的例子。</span></p><span class="trace-note">按 Q1–Q3 简单回复即可；不确定可说“请帮我建议”。回答后再追问相关细节，不必一次想全。</span></div><div class="trace-actions"><button data-clarification-template>用模板回答 ↓</button></div><p class="trace-note">在底部回复即可 · 当前为模拟澄清</p>'+(s.adjustments?.length?'<details><summary>已补充 '+s.adjustments.length+' 条回答</summary>'+agentSpecChanges(w)+'</details>':'')+'</div>'}
document.addEventListener('click',e=>{if(!e.target.closest('[data-clarification-template]'))return;const w=traceWork(),input=$('#requirement-message');if(!w||!input||input.disabled)return;const template='Q1 · 使用者、场景和问题：\nQ2 · 必须实现 / 不做 / 不能改变：\nQ3 · 当我……，系统应该……：';input.value=input.value.trim()?input.value+'\n\n'+template:template;activeSession(specFor(w)).chatDraft=input.value;input.focus()});
function requirementAgent(w){const s=specFor(w),locked=V().published;return '<section class="panel" style="border-top:3px solid var(--green)"><div class="row between"><h2>与 AI 一起完善需求</h2><span class="badge gray">对话原型 · 未接入 AI</span></div><p>直接描述要补充、修改或取消的内容。对话关联当前平台任务，保留需求修订历史。</p><div aria-live="polite" style="max-height:340px;overflow:auto;margin:16px 0">'+(s.messages?.length?s.messages.map(m=>'<div style="padding:14px;margin:10px 0;border-radius:10px;background:'+(m.role==='user'?'#eaf4ee':'#f3f5f4')+'"><strong>'+(m.role==='user'?'你':'AI 助手（模拟）')+'</strong><p style="white-space:pre-wrap">'+esc(m.text)+'</p></div>').join(''):'<p class="muted">例如：把弱网提示改成可关闭的横幅，并补充网络恢复后的行为。</p>')+'</div><label for="requirement-message">补充或调整需求</label><textarea id="requirement-message" rows="4" style="display:block;width:100%;padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:10px" placeholder="告诉 AI 你想怎么改；Shift + Enter 换行，Ctrl / ⌘ + Enter 发送" '+(locked?'disabled':'')+'>'+esc(s.chatDraft||'')+'</textarea><div class="row between" style="flex-wrap:wrap;gap:12px"><div class="trace-actions"><button data-agent-send '+(locked?'disabled':'')+'>发送修改</button><button data-trace="spec-history">需求修订记录</button></div><button class="primary" data-agent-develop '+(locked||w.status==='开发中'?'disabled':'')+'>'+(w.status==='开发中'?'开发进行中':'执行开发（修改）')+'</button></div><p class="trace-note">'+(locked?'已发布版本只读；请在新版本中发起修改。':'发送后记录修改并更新需求修订；执行开发时保存当前说明快照。不会真实修改仓库代码。')+'</p></section>'}
function sendRequirementMessage(){const w=traceWork(),v=requirementContext(),input=$('#requirement-message');if(!w||v.published||!input)return false;const message=input.value.trim();if(!message){toast('请先输入要调整的需求');return false}const s=specFor(w),c=activeSession(s);if(!c.chatStarted){c.chatStarted=true;c.specCollapsed=true}changeSharedRequirement(w,w.req+' 对话调整需求');s.history.push({version:s.revision,answers:{...s.answers,adjustments:[...(s.adjustments||[])]},confirmed:s.confirmed,time:stamp(),sessionId:c.id});c.messages??=[];s.adjustments??=[];if(!c.messages.length)c.title=message.slice(0,24);c.messages.push({role:'user',text:message});s.adjustments.push(message);s.revision++;s.confirmed=false;c.chatDraft='';c.messages.push({role:'assistant',text:w.req!=='REQ-101'&&!s.clarified?'已记录你的补充。你可以继续描述使用场景、期望行为或完成标准；不确定的地方也可以直接告诉我。（模拟回复，尚未生成正式需求说明）':'已将你的修改指令记录到 SPEC v'+s.revision+'，可在“需求开发”的“对话补充 / 调整”核对。当前为模拟回复，尚未生成完整改写或解决与原方案的冲突。你可以继续补充，或切换“开发模式”并发送演示开发流程。'});record(w.id+' / '+c.id+' 用户调整需求：'+message);render();requestAnimationFrame(()=>document.querySelector('.requirement-conversation .agent-message:last-child')?.scrollIntoView({block:'end'}));return true}
document.addEventListener('input',e=>{if(e.target.id==='requirement-message'){const w=traceWork();if(w)activeSession(specFor(w)).chatDraft=e.target.value}});

function startRequirementDevelopment(){const w=traceWork(),v=requirementContext();if(!w||!w.version||v.published||w.status==='开发中')return false;const s=specFor(w);s.confirmed=true;w.developmentSpec=JSON.parse(JSON.stringify({revision:s.revision,original:R(w.req).desc,adjustments:s.adjustments||[],sessionId:activeSession(s).id}));if(w.status==='已合入')changed(v,w.id+' 开始新一轮修改，旧候选包需重新验证');w.status='开发中';w.replayCount=0;record(w.id+' 按 SPEC v'+s.revision+' 执行开发（模拟）');vs.version=w.version;vs.page='version';vs.tab='提交记录';render();toast('已进入开发，当前仅模拟状态，不修改真实代码');return true}
function submitRequirementAgent(){const w=traceWork();if(!w)return;const v=requirementContext(),c=activeSession(specFor(w));if(v.published)return;if(c.mode!=='develop'){sendRequirementMessage();return}if(!w.version){toast('请先将需求纳入平台版本');return}if(w.status==='开发中'){toast('该任务正在开发中，可切换讨论模式继续沟通');return}if($('#requirement-message')?.value.trim()&&!sendRequirementMessage())return;startRequirementDevelopment()}

function developmentTrace(){const w=traceWork();if(!w)return '<div class="empty">当前版本没有开发任务</div>';const sample=w.req==='REQ-101';const count=w.replayCount??(w.status==='已合入'?7:w.status==='开发中'?4:0);return '<div class="trace-grid">'+taskPicker()+'<div><div class="panel"><div class="trace-title"><div><div class="trace-kicker">'+w.id+' / '+w.platform+' / 示例工作区</div><h2 style="margin-top:8px">'+esc(R(w.req).title)+'</h2></div><span class="badge">'+w.status+'</span></div><p>当前责任人：'+(count===4?'AI 开发助手 · 修复边界错误':count===6?'代码负责人 · 复核补测':'研发负责人')+'；下一步：'+(count===7?'对版本候选包执行回归与产品验收':count===4?'修复 CASE-02 后重跑边界测试':'检查当前步骤输出')+'。</p><div class="notice">过程演示数据。状态与事实分开展示：任务合入不代表业务验收完成；需求开发项与候选包验证仍需独立确认。</div><div class="trace-actions"><button data-vtab="需求开发">查看需求说明</button><button data-dev="'+w.id+'" '+(V().published||w.status==='已合入'?'disabled':'')+'>'+(w.status==='待开发'?'开始开发（模拟）':w.status==='已合入'?'已合入':'审查通过并合入（模拟）')+'</button><button data-trace="diff" '+(!sample?'disabled':'')+'>查看代码差异</button><button data-trace="replay" '+(!sample?'disabled':'')+'>从头回放失败与修复</button><button class="primary" data-trace="next-event" '+(!sample||count>=7?'disabled':'')+'>播放下一步</button></div></div><div class="panel"><div class="row between"><h2>开发过程与证据</h2><span class="badge gray">'+(sample?count+' / 7 步已展示':'暂无执行记录')+'</span></div>'+(sample?'<div class="trace-timeline">'+traceEvents.slice(0,count).map((x,i)=>'<article class="trace-event '+(i===3?'failed':'')+'"><div class="trace-kicker">'+x[0]+' · '+x[2]+'</div><h3>'+String(i+1).padStart(2,'0')+' '+x[1]+'</h3><p>'+x[3]+'</p><details><summary>输入、输出与执行依据</summary><p>'+x[4]+'</p><p>关联 '+w.id+' · '+V().platform+' '+V().name+' · 预置演示记录</p></details></article>').join('')+'</div>':'<div class="empty">暂无该任务的执行证据。真实接入后从开发执行器采集，不复用其他任务的日志。</div>')+'</div><div class="panel"><h2>仍需验证的内容</h2><div class="check">需求中的异常行为 <span class="badge amber">待需求确认</span></div><div class="check">最终候选包功能 <span class="badge amber">见版本测试</span></div><div class="check">真实设备 render=function(){const report=currentReport();if(report){vs.version=report.version}renderBeforeAgentDock();if(vs.page==='requirement'){document.querySelector('.content').innerHTML=clarification();document.querySelector('.topbar').innerHTML='<strong>需求详情 / '+esc(vs.requirement)+'</strong><span class="badge gray">原型</span>'}document.querySelector('.agent-dock')?.remove();const show=!location.hash.startsWith('#/test-runs/')&&['version','requirement'].includes(vs.page)&&vs.tab==='需求开发';document.body.classList.toggle('agent-docked',show);if(!show)return;document.body.insertAdjacentHTML('beforeend',dockedRequirementAgent());const dock=document.querySelector('.agent-dock'),conversation=document.createElement('section');conversation.className='requirement-conversation';conversation.setAttribute('aria-label','需求对话');conversation.append(dock.querySelector('header'),dock.querySelector('.agent-thread'));document.querySelector('.requirement-disclosure').after(conversation);const disclosure=document.querySelector('.requirement-disclosure');const w=traceWork();if(w){const layout=document.createElement('div');layout.className='requirement-workspace';disclosure.before(layout);layout.innerHTML=sessionList(specFor(w))+'<div class="requirement-main"></div>';layout.querySelector('.requirement-main').append(disclosure,conversation);disclosure.querySelector('.trace-list')?.remove();const grid=disclosure.querySelector('.trace-grid');if(grid)grid.style.display='block'}disclosure.addEventListener('toggle',()=>{const w=traceWork();if(w)activeSession(specFor(w)).specCollapsed=!disclosure.open})};
document.addEventListener('change',e=>{if(e.target.id==='agent-context-task'){trace.task=e.target.value;render()}});
function showAgentSpec(){const w=traceWork();if(w)activeSession(specFor(w)).specCollapsed=false;if(vs.page!=='requirement'){vs.page='version';vs.tab='需求开发'}render();document.querySelector('.requirement-disclosure')?.scrollIntoView({block:'start'})}
document.addEventListener('click',e=>{if(e.target.closest('[data-agent-show-spec]'))showAgentSpec()},true);
// Development remains a version-level action even when launched from a standalone report.
document.addEventListener('click',e=>{if(e.target.closest('[data-agent-develop]')&&location.hash.startsWith('#/test-runs/')){history.pushState(null,'','#/versions/'+vs.version+'/clarification');vs.page='version'}},true);

};
productRegistry.services.forEach(s=>{const p=productRegistry.products.find(p=>p.id===s.product);p.lines.forEach(line=>productRegistry.maps.push({id:'map-'+(productRegistry.maps.length+1),service:s.id,line,repo:'https://gitlab.example.invalid/'+s.team+'/'+s.id+'.git',branch:line==='咪咕'?'business/migu':'main',directory:'/',revision:1}))});
const RegistryLogic={
 snapshot:(maps,ids)=>JSON.parse(JSON.stringify(maps.filter(m=>ids.includes(m.id)))),
 eligibleVersions:(versions,mapId)=>versions.filter(v=>!v.published&&v.repoBindings?.some(m=>m.id===mapId)),
 jointSnapshot:tasks=>tasks.map(w=>({task:w.id,version:w.version,repository:JSON.parse(JSON.stringify(w.repoSnapshot)),commit:w.repoCommit,artifact:w.repoArtifact,status:w.status})),
 canJoint:tasks=>tasks.length>1&&tasks.every(w=>w.status==='已合入'&&w.repoCommit&&w.repoArtifact)
};
const registryUI={product:null,query:'',line:'全部',team:'全部'};
const regProduct=id=>productRegistry.products.find(p=>p.id===id),regService=id=>productRegistry.services.find(s=>s.id===id),regMap=id=>productRegistry.maps.find(m=>m.id===id);
const regOptions=(items,value)=>items.map(x=>'<option value="'+esc(typeof x==='string'?x:x.id)+'" '+((typeof x==='string'?x:x.id)===value?'selected':'')+'>'+esc(typeof x==='string'?x:x.name)+'</option>').join('');
const regChecks=(name,values,selected=[])=>'<div class="catalog-tags">'+values.map(x=>'<label><input type="checkbox" name="'+name+'" value="'+esc(x)+'" '+(selected.includes(x)?'checked':'')+'>'+esc(x)+'</label>').join('')+'</div>';
const checkedRegistry=name=>[...document.querySelectorAll('[name="'+name+'"]:checked')].map(x=>x.value);
const registryFooter=(action,id='')=>'<div class="dialog-footer"><button data-action="close">取消</button><button class="primary" data-reg="'+action+'" data-id="'+id+'">保存</button></div>';
const versionLabel=v=>v?(regProduct(v.productId)?.name||v.platform)+' / '+v.platform+' '+v.name:'待排期';
versions.forEach(v=>{const sid=v.platform==='Android'?'s-android':v.platform==='iOS'?'s-ios':v.platform==='Web'?'s-pad':null;if(sid){v.productId=regService(sid).product;v.businessLine='自建';v.repoBindings=RegistryLogic.snapshot(productRegistry.maps,productRegistry.maps.filter(m=>m.service===sid&&m.line==='自建').map(m=>m.id))}});
versions.push({id:'backend-demo',platform:'服务端',name:'1.8.0',productId:'p-cloud',businessLine:'自建',repoBindings:RegistryLogic.snapshot(productRegistry.maps,productRegistry.maps.filter(m=>m.service==='s-session'&&m.line==='自建').map(m=>m.id)),frozen:false,rev:1,published:false,builds:[]});
function registryHome(){const p=regProduct(registryUI.product);if(p)return registryDetail(p);const list=productRegistry.products.filter(p=>(p.name+' '+p.description).toLowerCase().includes(registryUI.query.toLowerCase())&&(registryUI.line==='全部'||p.lines.includes(registryUI.line))&&(registryUI.team==='全部'||productRegistry.services.some(s=>s.product===p.id&&(s.team===registryUI.team||s.collaborators.includes(registryUI.team)))));return heading('WORKSPACE / PRODUCT REPOSITORIES','仓库配置','维护产品、代码服务与业务线的关系，为版本和跨仓库开发提供配置。','<button class="primary" data-reg="edit-product">＋ 新增产品</button>')+'<p class="trace-note">验证：多业务线、多仓库如何协作交付。所有归属配置、仓库、分支均为示例；尚未连接 GitLab，刷新恢复初始数据。</p><div class="row catalog-toolbar"><input id="catalog-query" placeholder="搜索产品" value="'+esc(registryUI.query)+'"><select id="catalog-line" aria-label="业务线筛选">'+regOptions(['全部',...productRegistry.lines],registryUI.line)+'</select><select id="catalog-team" aria-label="研发小组筛选">'+regOptions(['全部',...productRegistry.teams],registryUI.team)+'</select><button data-reg="filter">筛选</button></div>'+list.map(p=>'<section class="panel catalog-card"><div><h2>'+esc(p.name)+'</h2><p>'+esc(p.description)+'</p><div class="catalog-tags">'+p.lines.map(l=>'<span class="badge gray">'+esc(l)+'</span>').join('')+'</div><p class="trace-note">'+productRegistry.services.filter(s=>s.product===p.id).length+' 个代码服务</p></div><button data-reg="detail" data-id="'+p.id+'">查看详情 →</button></section>').join('')+(!list.length?'<div class="empty">没有匹配的产品</div>':'')+'<div class="panel"><h3>跨仓库协作演示</h3><p>示例：Android SDK 展示排队时间，cg-session 提供接口。分别开发，联合验收。</p><button data-reg="demo">打开多仓库需求示例 →</button></div>'}
function registryDetail(p){const services=productRegistry.services.filter(s=>s.product===p.id);return heading('PRODUCT / '+p.id,p.name,p.description,'<div class="row"><button data-reg="home">返回产品列表</button><button data-reg="edit-product" data-id="'+p.id+'">编辑产品</button><button class="primary" data-reg="edit-service" data-id="" data-product="'+p.id+'">＋ 代码服务</button></div>')+'<div class="catalog-tags">'+p.lines.map(l=>'<span class="badge">'+esc(l)+'</span>').join('')+'</div><p class="trace-note">仓库地址和分支为手工维护的示例；修改配置不会覆盖历史版本、开发和验收快照。</p>'+services.map(s=>'<section class="panel"><div class="row between"><div><h2>'+esc(s.name)+'</h2><p>'+esc(s.platform)+' · 主责：'+esc(s.team)+(s.collaborators.length?' · 协作：'+esc(s.collaborators.join('、')):'')+'</p><div class="catalog-kv"><span>构建类型：'+esc(s.buildProfile||'应用')+'</span><span>API 文档：'+esc(s.docType||'无需文档')+'</span><span>来源：'+esc(s.docSource||'—')+'</span></div></div><div class="row"><button data-reg="edit-service" data-id="'+s.id+'">编辑服务</button><button data-reg="edit-map" data-service="'+s.id+'">＋ 仓库映射</button></div></div><div class="table-wrap"><table class="trace-table"><thead><tr><th>业务线</th><th>所属仓库 / 目录</th><th>默认开发分支</th><th>配置修订</th><th></th></tr></thead><tbody>'+productRegistry.maps.filter(m=>m.service===s.id).map(m=>'<tr><td>'+esc(m.line)+'</td><td class="repo-path">'+esc(m.repo)+'<br>目录：'+esc(m.directory)+'</td><td>'+esc(m.branch)+'</td><td>r'+m.revision+' · 示例</td><td><button data-reg="edit-map" data-id="'+m.id+'">编辑</button></td></tr>').join('')+'</tbody></table></div></section>').join('')}
function editRegistryProduct(id){const p=regProduct(id);openModal(p?'编辑产品':'新增产品','<div class="catalog-form"><label>产品名称<input id="rp-name" value="'+esc(p?.name||'')+'"></label><label>产品说明<input id="rp-desc" value="'+esc(p?.description||'')+'"></label><label>适用业务线</label>'+regChecks('rp-lines',productRegistry.lines,p?.lines)+'</div>',registryFooter('save-product',id))}
function editRegistryService(id,pid){const s=regService(id),p=regProduct(s?.product||pid);openModal(s?'编辑代码服务':'新增代码服务','<div class="catalog-form"><p>所属产品：'+esc(p.name)+'</p><label>服务名称<input id="rs-name" value="'+esc(s?.name||'')+'"></label><label>平台<select id="rs-platform">'+regOptions([...vp,'服务端'],s?.platform||'Android')+'</select></label><label>构建类型<select id="rs-build-profile">'+regOptions(['SDK','Web','镜像','二进制'],s?.buildProfile||'SDK')+'</select></label><label>API 文档类型<select id="rs-doc-type">'+regOptions(['无需文档','OpenAPI','SDK Reference','Web API'],s?.docType||'无需文档')+'</select></label><label>文档来源路径<input id="rs-doc-source" placeholder="例如 openapi/service.yaml 或 docs/api" value="'+esc(s?.docSource||'')+'"></label><label>主要负责小组<select id="rs-team">'+regOptions(productRegistry.teams,s?.team||'客户端')+'</select></label><label>协作小组</label>'+regChecks('rs-collaborators',productRegistry.teams,s?.collaborators)+'<p class="trace-note">构建类型决定候选包的阶段：SDK 包含 SDK、Demo 与文档构建；后台服务可选择镜像或二进制构建。</p></div>','<input type="hidden" id="rs-product" value="'+p.id+'">'+registryFooter('save-service',id))}
function editRegistryMap(id,sid){const m=regMap(id),s=regService(m?.service||sid),p=regProduct(s.product);openModal(m?'编辑仓库映射':'新增仓库映射','<div class="catalog-form"><p>'+esc(p.name)+' / '+esc(s.name)+'</p><label>业务线<select id="rm-line">'+regOptions(p.lines,m?.line||p.lines[0])+'</select></label><label>仓库地址<input id="rm-repo" placeholder="https://gitlab.example.invalid/group/repo.git" value="'+esc(m?.repo||'')+'"></label><label>默认开发分支<input id="rm-branch" value="'+esc(m?.branch||'main')+'"></label><label>仓库内目录<input id="rm-dir" value="'+esc(m?.directory||'/')+'"></label><p class="trace-note">仅保存配置，不连接仓库。不要填入令牌或密码。</p></div>','<input type="hidden" id="rm-service" value="'+s.id+'">'+registryFooter('save-map',id))}
function versionRegistryFields(pid,line){const p=regProduct(pid)||productRegistry.products[0];return '<label>产品<select id="rv-product">'+regOptions(productRegistry.products,p.id)+'</select></label><label>业务线<select id="rv-line">'+regOptions(p.lines,p.lines.includes(line)?line:p.lines[0])+'</select></label><div id="rv-maps"></div>'}
function updateVersionMappings(selected=[]){const pid=$('#rv-product').value,line=$('#rv-line').value;$('#rv-maps').innerHTML='<label>涉及的代码服务 / 仓库（可多选）</label>'+productRegistry.maps.filter(m=>regService(m.service).product===pid&&m.line===line).map(m=>'<label style="display:block;margin:10px 0"><input type="checkbox" name="rv-map" value="'+m.id+'" '+(selected.includes(m.id)?'checked':'')+' style="width:auto"> '+esc(regService(m.service).name)+'<div class="repo-path">'+esc(m.repo)+' · '+esc(m.branch)+' · '+esc(m.directory)+'</div></label>').join('')}

function versionRegistrySummary(v){return '<section class="panel"><div class="row between"><h2>产品与代码来源</h2><button data-reg="version" data-id="'+v.id+'" '+(v.published?'disabled':'')+'>配置</button></div><p>'+esc(regProduct(v.productId)?.name||'未关联产品')+' · '+esc(v.businessLine||'未选择业务线')+'</p>'+(v.repoBindings||[]).map(m=>'<div class="repo-path">'+esc(regService(m.service)?.name||m.service)+' · '+esc(m.repo)+' · '+esc(m.branch)+' · '+esc(m.directory)+' <span class="badge gray">配置快照 r'+m.revision+'</span></div>').join('')+'</section>'}
function repoTasks(r){return work.filter(w=>w.req===r.id&&w.repoSnapshot)}

 const v=versions.find(v=>v.id===context.version),b=v?.builds.find(b=>b.n===Number($('#run-candidate-select')?.value)),environment=testResources.environments.find(x=>x.id===$('#run-environment')?.value),device=testResources.devices.find(x=>x.id===$('#run-device')?.value),problem=runResourceError(v,b,environment,device);
 if(problem){$('#run-resource-error').textContent=problem;return false}vs.version=v.id;vs.build=b.n;
 const ok=launchRunBeforeResources(context.parent?{...context.parent,build:b.n}:undefined);if(!ok)return false;
 const r=reports.at(-1);r.resourceSnapshot=JSON.parse(JSON.stringify({environment,device,capturedAt:new Date().toISOString(),simulated:true}));resourceRunContext=null;return true;
};
function openResourceRunDialog(parent,build){
 const v=parent?versions.find(v=>v.id===parent.version):V();if(!v)return;const b=v.builds.find(b=>b.n===(build??parent?.build??vs.build)&&b.rev===v.rev)||v.builds.filter(b=>b.rev===v.rev).at(-1);
 const environments=testResources.environments.filter(x=>x.platforms.includes(v.platform)&&(!v.businessLine||x.line===v.businessLine)),devices=testResources.devices.filter(x=>x.platform===v.platform);
 const environment=environments.find(x=>x.id===parent?.resourceSnapshot?.environment.id&&x.enabled)||environments.find(x=>x.enabled),device=devices.find(x=>x.id===parent?.resourceSnapshot?.device.id&&!resourceUnavailable(x,v.platform))||devices.find(x=>!resourceUnavailable(x,v.platform));resourceRunContext={version:v.id,parent:parent||null};
 openModal('发起系统测试','<div class="resource-run-fields">'+runSuiteFields(v,parent)+'<label>候选包<select id="run-candidate-select">'+(!b?'<option value="">暂无有效候选包</option>':'')+v.builds.slice().reverse().map(x=>'<option value="'+x.n+'" '+(b?.n===x.n?'selected ':'')+(x.rev!==v.rev?'disabled':'')+'>build '+x.n+' · 范围 r'+x.rev+(x.rev!==v.rev?' · 已过期':'')+'</option>').join('')+'</select></label><label>测试环境 · '+esc(v.businessLine||'全部业务线')+'<select id="run-environment">'+(!environment?'<option value="">无可用环境</option>':'')+environments.map(x=>'<option value="'+x.id+'" '+(x.id===environment?.id?'selected ':'')+(!x.enabled?'disabled':'')+'>'+esc(x.name)+(x.enabled?'':' · 已停用')+'</option>').join('')+'</select></label><label>测试设备 · '+esc(v.platform)+'<select id="run-device">'+(!device?'<option value="">无可用设备</option>':'')+devices.map(x=>'<option value="'+x.id+'" '+(x.id===device?.id?'selected ':'')+(resourceUnavailable(x,v.platform)?'disabled':'')+'>'+esc(x.name+' / '+x.os)+(resourceUnavailable(x,v.platform)?' · '+resourceUnavailable(x,v.platform):' · 空闲')+'</option>').join('')+'</select></label></div><p class="trace-note">每次绑定一个环境和一台设备；设备在执行中占用，完成或取消后释放。全部为模拟。</p><p id="run-resource-error" class="resource-error" role="alert">'+esc(v.published?'已发布版本不可发起测试':!b?'请先构建有效候选包':!environment||!device?'请先在测试资源中启用兼容、在线且空闲的资源':'')+'</p>','<div class="dialog-footer"><button data-action="close">取消</button><button class="primary" data-resource-action="confirm-run" '+(!b||v.published||!environment||!device?'disabled':'')+'>开始系统测试（模拟）</button></div>');
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if('candidateTest'in d||'runRetry'in d){e.preventDefault();e.stopImmediatePropagation();openResourceRunDialog('runRetry'in d?currentReport():null,'candidateTest'in d?Number(d.candidateTest):undefined);return}
 if(!d.resourceAction)return;e.preventDefault();e.stopImmediatePropagation();const action=d.resourceAction;

 if(action==='filter'){resourceUI.query=$('#resource-query').value.trim();resourceUI.filter=$('#resource-filter').value;render();return}
 if(action==='new'||action==='edit'){openResourceEditor(d.id);return}if(action==='save'){saveResource(d.id);return}
 if(action==='confirm-run'){if(launchRun())$('#modal').close();return}
 const env=resourceUI.tab==='environments',x=testResources[resourceUI.tab].find(x=>x.id===d.id);if(!x)return;if(env?environmentRuns(x.id).length:deviceRun(x.id)){toast('资源正在执行测试，不能更改状态');return}
 if(action==='toggle')x.enabled=!x.enabled;if(action==='connection'){x.online=!x.online;if(x.online)x.heartbeat=new Date().toLocaleString('zh-CN')}
 record('测试资源 '+x.name+' 状态调整（模拟）');render();

// Evidence uses the immutable snapshot; seeded legacy reports remain explicitly unrecorded.
document.addEventListener('click',e=>{if(!e.target.closest('[data-run-evidence]'))return;const r=currentReport(),s=r?.resourceSnapshot;const fields=document.querySelectorAll('#evidence-drawer .run-meta>div');for(const field of fields)if(field.querySelector('small')?.textContent==='执行环境')field.innerHTML='<small>执行环境</small>'+esc(s?s.environment.name+' / '+s.device.name+' / '+s.device.os:'未记录（历史执行）')});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/test-resources/')){vs.page='test-resources';resourceUI.tab=location.hash.endsWith('/suites')?'suites':location.hash.endsWith('/devices')?'devices':'environments';render()}});
if(location.hash.startsWith('#/test-resources/')){vs.page='test-resources';resourceUI.tab=location.hash.endsWith('/suites')?'suites':location.hash.endsWith('/devices')?'devices':'environments'}
render();

<script>
// Global artifact management is a derived view over versions[].builds[]. No duplicate artifact store.
const artifactUI={query:'',line:'全部',platform:'全部',service:'全部',version:'全部',status:'全部'};
function artifactServices(v){return [...new Set((v.repoBindings||[]).map(m=>m.service))].map(regService).filter(Boolean)}
function artifactId(v,b){return 'ART-'+v.id+'-b'+b.n+'-r'+b.rev}
function buildStagePlan(v){const profiles=artifactServices(v).map(s=>s.buildProfile).filter(Boolean);if(profiles.includes('SDK')||['Android','iOS','Windows','macOS'].includes(v.platform))return ['SDK 构建','Demo 构建','文档构建'];const backend=[...new Set(profiles.filter(p=>p==='镜像'||p==='二进制').map(p=>p+'构建'))];if(backend.length)return backend;return ['应用构建','文档构建']}
function syncBuildProgress(v,b){const stages=b.buildStages||[];b.buildStatus=stages.some(s=>s.status==='失败')?'部分失败':stages.some(s=>s.status==='进行中'||s.status==='等待')?'构建中':'成功';const docStage=stages.find(s=>s.name==='文档构建');if(docStage)(b.apiDocs||[]).forEach(d=>{d.status=docStage.status==='完成'?'已生成':docStage.status==='失败'?'生成失败':'待生成'})}
function ensureArtifactMetadata(){
 versions.forEach((v,vi)=>v.builds.forEach((b,bi)=>{
  b.createdAt??=(v.id==='and-082'&&b.n===1?'2026-09-18T14:35:00+08:00':v.id==='and-082'&&b.n===2?'2026-09-20T15:30:00+08:00':new Date(Date.now()-(vi*7+bi)*3600000).toISOString());
  b.commit??='demo-'+v.id.replace(/[^a-z0-9]/gi,'').slice(0,8)+'-b'+b.n;
  if(v.id==='and-082'&&b.n===2){b.downloads??=[{name:'cloud-game-demo-0.8.2-b2.apk',type:'APK',url:'artifacts/demo/cloud-game-demo-0.8.2-b2.apk',note:'原型 APK 占位包，不可安装'}];b.webPreview??='ai-dev-pipeline-prototype.html#/artifact-preview/and-082/build/2'}
  if(!b.buildStages){const running=b.result==='待执行'&&!b.releasedAt;b.buildStages=buildStagePlan(v).map((name,i)=>({name,status:running?(i===0?'进行中':'等待'):(v.id==='and-082'&&b.n===1&&name==='文档构建'?'失败':'完成')}))}
  if(!b.apiDocs){const services=artifactServices(v);b.apiDocs=services.filter(s=>s.docType&&s.docType!=='无需文档').map(s=>({serviceId:s.id,serviceName:s.name,type:s.docType,source:s.docSource,version:v.name+'-b'+b.n,commit:b.commit,status:'待生成',generatedAt:b.createdAt,simulated:true}));}
  syncBuildProgress(v,b);
 }))
}
function buildProgressMarkup(v,b){const stages=b.buildStages||[],done=stages.filter(s=>s.status==='完成').length,failed=stages.filter(s=>s.status==='失败').length,complete=done+failed===stages.length,percent=stages.length?Math.round((done+failed)/stages.length*100):0;return '<div class="build-progress"><div class="build-progress-head"><strong>构建进度</strong><span>'+done+' / '+stages.length+' 完成'+(failed?' · '+failed+' 项失败':'')+'</span></div><div class="build-progress-track"><span style="width:'+percent+'%"></span></div><div class="build-stages">'+stages.map(s=>'<span class="build-stage '+(s.status==='完成'?'done':s.status==='进行中'?'running':s.status==='失败'?'failed':'pending')+'">'+esc(s.name)+' · '+esc(s.status)+'</span>').join('')+'</div>'+(complete?'':'<button style="margin-top:10px" data-artifact-action="advance-build" data-version="'+v.id+'" data-build="'+b.n+'">推进构建（模拟）</button>')+'</div>'}
function advanceBuildProgress(v,b){const stages=b.buildStages||[],current=stages.findIndex(s=>s.status==='进行中');if(current<0)return;stages[current].status='完成';if(stages[current+1])stages[current+1].status='进行中';syncBuildProgress(v,b);record(v.platform+' '+v.name+' build '+b.n+' 构建阶段推进：'+stages[current].name+' 完成');render()}
buildList=function(v){ensureArtifactMetadata();return '<div class="section-head"><h2>版本候选包</h2>'+vbutton('build','构建新候选包（模拟）',true,v.published||!W(v).length||W(v).some(w=>w.status!=='已合入'))+'</div><p>所有任务合入后构建统一候选包；任务预览不能替代版本回归。</p>'+v.builds.map(b=>{const ready=b.buildStatus==='成功',docs=artifactDocState(b);return '<div class="panel"><div class="row between"><div><h2>'+v.platform+' '+v.name+' / build '+b.n+'</h2><p>范围 r'+b.rev+' · 摘要 DEMO-'+v.id+'-b'+b.n+' · 自动测试：'+b.result+'</p></div><div class="row"><span class="badge '+(b.rev!==v.rev?'amber':'gray')+'">'+(b.rev!==v.rev?'历史范围':'当前范围')+'</span><button data-build="'+b.n+'">查看测试与验收 →</button></div></div>'+buildProgressMarkup(v,b)+artifactAccessView(v,b)+'<div class="row"><button data-previewbuild="'+b.n+'" '+(ready?'':'disabled')+'>体验候选包（模拟）</button><button data-candidate-test="'+b.n+'" '+(v.published||b.rev!==v.rev||!ready?'disabled':'')+'>发起系统测试</button><button class="primary" data-publish-candidate="'+b.n+'" '+(b.releasedAt||!ready||!['已生成','无需文档'].includes(docs)?'disabled':'')+'>'+(b.releasedAt?'已发布':'发布（模拟）')+'</button></div>'+(b.releasedAt?'<p class="trace-note">发布于 '+esc(b.releasedAt)+'</p>':'')+'</div>'}).join('')}
function candidateStageAccess(v,b,s){if(s.status!=='完成')return '';if(s.name==='文档构建')return (b.apiDocs||[]).filter(d=>d.status==='已生成').map(d=>'<a href="ai-dev-pipeline-prototype.html#/api-docs/'+encodeURIComponent(v.id)+'/build/'+b.n+'/'+b.apiDocs.indexOf(d)+'" target="_blank" rel="noopener">API文档 ↗</a>').join(' ');const demo=s.name==='Demo 构建',downloads=(b.downloads||[]).filter(d=>demo?d.type==='APK':d.type!=='APK');return downloads.map(d=>'<a href="'+esc(d.url)+'" download="'+esc(d.name)+'" title="'+esc(d.note||d.name)+'">下载 '+esc(d.type)+'</a>').join(' ')+(demo&&b.webPreview?'<a href="'+esc(b.webPreview)+'" target="_blank" rel="noopener">访问 Web ↗</a>':'')}

function artifactDocState(b){const docs=b.apiDocs||[];if(!docs.length)return '无需文档';if(docs.some(d=>d.status==='生成失败'))return '生成失败';if(docs.every(d=>d.status==='已生成'))return '已生成';return '待生成'}
function artifactTestState(v,b){const runs=reports.filter(r=>r.version===v.id&&r.build===b.n);return runs.at(-1)?.status||b.result||'待执行'}

function artifactMatchesStatus(row){const s=artifactUI.status,test=artifactTestState(row.v,row.b),docs=artifactDocState(row.b),release=artifactReleaseState(row.v,row.b);return s==='全部'||s===release||s==='测试通过'&&/通过/.test(test)||s==='测试失败'&&/失败/.test(test)||s==='待测试'&&test==='待执行'||s==='文档异常'&&docs==='生成失败'}
function filteredArtifacts(){return artifactRows().filter(({v,b,services,product})=>{const q=artifactUI.query.toLowerCase(),hay=[artifactId(v,b),v.name,v.platform,v.businessLine,product?.name,...services.map(s=>s.name),b.commit].join(' ').toLowerCase();return hay.includes(q)&&(artifactUI.line==='全部'||v.businessLine===artifactUI.line)&&(artifactUI.platform==='全部'||v.platform===artifactUI.platform)&&(artifactUI.service==='全部'||services.some(s=>s.id===artifactUI.service))&&(artifactUI.version==='全部'||v.id===artifactUI.version)&&artifactMatchesStatus({v,b})})}

 '<div class="stats artifact-summary">'+[['制品',all.length],['已发布',released],['文档已生成',docReady],['待测试',pending]].map(([k,n])=>'<div class="stat"><small>'+k+'</small><b>'+n+'</b></div>').join('')+'</div>'+
 '<div class="artifact-toolbar"><input id="artifact-query" aria-label="搜索制品" placeholder="制品 / 版本 / Commit / 服务" value="'+esc(artifactUI.query)+'"><select id="artifact-line" aria-label="业务线筛选">'+resourceOptions(['全部',...productRegistry.lines],artifactUI.line)+'</select><select id="artifact-platform" aria-label="平台筛选">'+resourceOptions(['全部',...new Set(versions.map(v=>v.platform))],artifactUI.platform)+'</select><select id="artifact-service" aria-label="代码服务筛选"><option value="全部">全部代码服务</option>'+productRegistry.services.map(s=>'<option value="'+s.id+'" '+(artifactUI.service===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><select id="artifact-version" aria-label="版本筛选"><option value="全部">全部版本</option>'+versions.map(v=>'<option value="'+v.id+'" '+(artifactUI.version===v.id?'selected':'')+'>'+esc(v.platform+' '+v.name)+'</option>').join('')+'</select><select id="artifact-status" aria-label="制品状态筛选">'+resourceOptions(['全部','候选包','已发布','待测试','测试通过','测试失败','文档异常'],artifactUI.status)+'</select><button data-artifact-action="filter">筛选</button></div>'+

p>'}

function openArtifactDrawer(versionId,buildNo,updateHash=true){const hit=artifactLookup(versionId,buildNo);if(!hit)return;ensureArtifactMetadata();const {v,b}=hit,services=artifactServices(v),docs=b.apiDocs||[],test=artifactTestState(v,b),release=artifactReleaseState(v,b),tasks=b.scopeSnapshot?.tasks||W(v);removeArtifactDrawer(false);document.body.insertAdjacentHTML('beforeend','<div class="artifact-drawer-backdrop" data-artifact-action="close"></div><aside class="artifact-drawer" role="dialog" aria-modal="true" aria-label="制品详情"><header><div><div class="eyebrow">'+esc(artifactId(v,b))+'</div><h2 style="margin-top:7px">'+esc(v.platform+' '+v.name+' / build '+b.n)+'</h2><p>'+esc(regProduct(v.productId)?.name||'未关联产品')+' · '+esc(v.businessLine||'未配置业务线')+'</p></div><button data-artifact-action="close" aria-label="关闭制品详情">×</button></header><div class="artifact-status-grid"><div><small>构建</small>'+artifactBadge(b.buildStatus)+'</div><div><small>测试</small>'+artifactBadge(test)+'</div><div><small>API 文档</small>'+artifactBadge(artifactDocState(b))+'</div><div><small>发布</small>'+artifactBadge(release)+'</div></div><section><h3>构建快照</h3>'+buildProgressMarkup(v,b)+artifactAccessView(v,b)+'<div class="meta"><div><span>范围修订</span><strong>r'+b.rev+'</strong></div><div><span>Commit</span><strong>'+esc(b.commit)+'</strong></div><div><span>构建时间</span><strong>'+new Date(b.createdAt).toLocaleString('zh-CN')+'</strong></div><div><span>代码服务</span><strong>'+esc(services.map(s=>s.name).join(' / ')||'未关联')+'</strong></div></div><div class="row"><button data-artifact-action="version" data-version="'+v.id+'">返回对应版本</button></div></section><section><h3>关联需求 <span class="badge gray">'+tasks.length+'</span></h3>'+(tasks.length?tasks.map(t=>'<div class="check"><span>'+esc(t.id+' · '+(R(t.req)?.title||t.req))+'</span><small>'+esc(t.status||'快照')+'</small></div>').join(''):'<p>该历史制品没有需求快照。</p>')+'</section><section><h3>API 文档快照</h3>'+(docs.length?docs.map((d,i)=>'<div class="artifact-doc-row"><div><strong>'+esc(d.serviceName)+' · '+esc(d.type)+'</strong><small>'+esc(d.source)+' · '+esc(d.version)+' · '+esc(d.status)+'</small></div>'+(d.status==='已生成'?'<a class="artifact-link" href="ai-dev-pipeline-prototype.html#/api-docs/'+encodeURIComponent(v.id)+'/build/'+b.n+'/'+i+'" target="_blank" rel="noopener">新页面查看 ↗</a>':'<span class="badge amber">不可查看</span>')+'</div>').join(''):'<p>此代码服务配置为无需 API 文档。</p>')+'</section><section><h3>测试与发布记录</h3><p>执行记录：'+reports.filter(r=>r.version===v.id&&r.build===b.n).length+' 条 · 当前结果：'+esc(test)+'</p><p>发布状态：'+esc(release)+(b.releasedAt?' · '+esc(b.releasedAt):'')+'</p></section></aside>');if(updateHash)history.replaceState(null,'','#/artifacts/'+encodeURIComponent(v.id)+'/build/'+b.n);document.querySelector('.artifact-drawer [aria-label="关闭制品详情"]')?.focus()}

function apiDocPreview(v,b,index){const d=b.apiDocs?.[Number(index)];if(!d||d.status!=='已生成')return;const samples=apiDocSamples(d);openModal('API 文档 · '+d.serviceName,'<div class="row"><span class="badge gray">模拟预览 · 内部可见</span><strong>'+esc(d.type)+'</strong></div><div class="meta"><div><span>文档版本</span><strong>'+esc(d.version)+'</strong></div><div><span>对应 Commit</span><strong>'+esc(d.commit)+'</strong></div><div><span>来源路径</span><strong>'+esc(d.source)+'</strong></div><div><span>生成时间</span><strong>'+new Date(d.generatedAt).toLocaleString('zh-CN')+'</strong></div></div><div class="api-preview-list">'+samples.map(x=>'<div class="api-preview-item"><code>'+esc(x[0]+' '+x[1])+'</code><span>'+esc(x[2])+'</span></div>').join('')+'</div><p class="trace-note">当前为预置文档结构示例，没有访问真实接口，也不包含域名、AK/SK 或调用凭据。</p>','<div class="dialog-footer"><button data-action="close">关闭</button></div>')}
function apiDocPage(v,b,index){const d=b?.apiDocs?.[Number(index)];if(!d||d.status!=='已生成')return '<div class="empty">该 API 文档尚未生成，暂不可查看。</div>';const sdk=d.type==='SDK Reference',sections=[['intro','概述'],['quickstart','快速接入'],['version','获取版本'],['start','启动会话'],['events','事件回调'],['errors','错误码'],['changes','更新记录']],code=s=>'<pre><code>'+esc(s)+'</code></pre>',table=(heads,rows)=>'<div class="table-wrap"><table><thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';return '<article class="reference-doc"><header class="reference-header"><div><span class="eyebrow">FORGE / DEVELOPER DOCUMENTATION</span><h1>'+esc(d.serviceName)+'</h1><p>API Reference <span class="badge">v'+esc(v.name)+'</span> <span class="badge gray">示例文档</span></p></div><div class="reference-meta">build '+b.n+' · '+esc(d.commit)+'<br>更新于 '+esc(new Date(d.generatedAt).toLocaleDateString('zh-CN'))+'</div></header><div class="reference-layout"><nav aria-label="文档目录"><strong>开发指南</strong>'+sections.map(([id,label])=>'<button data-doc-section="'+id+'">'+label+'</button>').join('')+'<small>'+esc(d.type)+'<br>'+esc(d.source)+'</small></nav><main><section id="doc-intro"><span class="eyebrow">GETTING STARTED</span><h2>概述</h2><p>'+esc(d.serviceName)+' 提供云游戏会话接入、网络质量反馈与生命周期管理能力。本指南介绍从初始化到启动游戏的完整接入流程。</p><aside>此为候选包附带的示例文档，接口名称与代码用于展示文档结构。</aside>'+table(['接入要求','说明'],[[sdk?'运行环境':'协议',sdk?'Android 8.0（API 26）及以上':'HTTPS / JSON'],['字符编码','UTF-8'],['线程约定',sdk?'UI 操作在主线程执行，回调在主线程返回':'异步请求；使用 requestId 关联日志'],['版本兼容','同一主版本内保持已公开接口兼容']])+'</section><section id="doc-quickstart"><h2>快速接入</h2><p>完成依赖配置后初始化客户端，再使用业务系统签发的短期会话凭证启动游戏。</p><h3>1. 配置依赖</h3>'+code(sdk?'// app/build.gradle.kts · 示例\ndependencies {\n    implementation(files("libs/cloud-game-sdk-'+v.name+'.aar"))\n}':'// 安装业务客户端后配置服务地址\nconst client = new CloudGameClient({\n  baseUrl: "https://api.example.invalid",\n  timeout: 10000\n});')+'<h3>2. 初始化并启动</h3>'+code(sdk?'val config = SdkConfig.Builder()\n    .setApplicationId("demo-app")\n    .setLogLevel(LogLevel.INFO)\n    .build()\n\nCloudGameSdk.initialize(applicationContext, config)\n\nval options = SessionOptions(\n    gameId = "demo-game",\n    sessionToken = "<SESSION_TOKEN>",\n    networkWarningThresholdMs = 80\n)\nCloudGameSdk.startGame(activity, options, listener)':'const session = await client.startSession({\n  gameId: "demo-game",\n  sessionToken: "<SESSION_TOKEN>"\n});\nconsole.log(session.sessionId);')+'</section><section id="doc-version"><h2>获取版本 <span class="badge gray">同步</span></h2><p>返回当前客户端的版本号。可在设置页面和问题反馈中展示。</p>'+code(sdk?'fun getVersion(): String\n\nval version = CloudGameSdk.getVersion()\n// "'+v.name+'"':'client.getVersion(); // "'+v.name+'"')+'<h3>返回值</h3>'+table(['类型','说明'],[['String','语义化版本号，例如 '+v.name]])+'</section><section id="doc-start"><h2>启动会话 <span class="badge">异步</span></h2><p>验证启动参数并建立游戏会话。成功后通过 onSessionReady 返回会话信息；失败通过 onError 返回错误原因。</p>'+code(sdk?'fun startGame(\n    activity: Activity,\n    options: SessionOptions,\n    listener: SessionListener\n): Unit':'POST /v1/sessions\nContent-Type: application/json')+'<h3>SessionOptions</h3>'+table(['字段','类型','必填','说明'],[['gameId','String','是','目标游戏标识'],['sessionToken','String','是','业务系统签发的短期凭证'],['networkWarningThresholdMs','Int','否','弱网提示阈值，默认 80ms'],['orientation','String','否','landscape / portrait，默认 landscape'],['requestId','String','否','调用方请求编号，用于追踪']])+'<h3>行为说明</h3><p>延迟高于阈值时触发弱网提示，用户仍可继续进入。相同会话启动中重复调用会返回 SESSION_BUSY；无效凭证会返回 TOKEN_INVALID。</p><h3>成功结果</h3>'+code('{\n  "sessionId": "session-demo-001",\n  "gameId": "demo-game",\n  "state": "READY",\n  "requestId": "req-demo-001"\n}')+'</section><section id="doc-events"><h2>事件回调</h2>'+table(['事件','参数','触发时机'],[['onSessionReady','SessionInfo','会话连接成功，可开始交互'],['onNetworkQualityChanged','latencyMs: Int','网络质量发生变化'],['onError','code: Int, message: String','启动或运行过程中发生错误'],['onSessionClosed','reason: String','用户退出或会话结束']])+code(sdk?'override fun onNetworkQualityChanged(latencyMs: Int) {\n    weakNetworkHint.isVisible = latencyMs > 80\n}\n\noverride fun onSessionClosed(reason: String) {\n    finish()\n}':'client.on("networkQualityChanged", ({ latencyMs }) => {\n  showNetworkHint(latencyMs > 80);\n});')+'</section><section id="doc-errors"><h2>错误码</h2>'+table(['错误码','标识','处理建议'],[['1001','NOT_INITIALIZED','先调用 initialize，再启动会话'],['1002','INVALID_ARGUMENT','检查必填参数和参数范围'],['2001','TOKEN_INVALID','重新获取会话凭证后重试'],['2002','SESSION_BUSY','等待当前启动操作结束'],['3001','NETWORK_TIMEOUT','检查网络并提供重试入口'],['3002','CONNECTION_LOST','提示用户连接断开并尝试恢复']])+'</section><section id="doc-changes"><h2>更新记录</h2><h3>'+esc(v.name)+' · build '+b.n+'</h3><ul><li>新增启动页弱网提示，支持自定义延迟阈值。</li><li>提供版本查询接口，便于定位用户反馈。</li><li>补充会话生命周期与异常处理示例。</li></ul><p class="reference-meta">文档来源：'+esc(d.source)+' · 构建快照：'+esc(d.version)+'</p></section></main></div></article>'}
function artifactWebPreviewPage(v,b){return '<div class="artifact-web-preview"><div class="artifact-web-phone"><span class="badge">Web 候选包 · 模拟</span><h1>'+esc(v.platform+' '+v.name+' / build '+b.n)+'</h1><p>云游戏 Demo 在线体验入口</p><div class="preview-status">网络延迟 81ms · 当前网络可能影响体验</div><div class="row"><button>继续进入</button><button disabled>连接真实会话（未接入）</button></div><p style="margin-top:18px;opacity:.76">此页面用于验证候选包在线访问流程，不会启动真实云游戏会话。</p></div></div>'}
function publishGlobalArtifact(v,b){ensureArtifactMetadata();const docs=artifactDocState(b);if(v.published||b.releasedAt)return;if(b.buildStatus!=='成功'){toast('构建尚未完成，不能发布');return}if(!['已生成','无需文档'].includes(docs)){toast('API 文档尚未生成成功，不能发布');return}b.releasedAt=new Date().toLocaleString('zh-CN');const snapshot=JSON.parse(JSON.stringify({build:b,scope:b.scopeSnapshot||{tasks:W(v)},rev:b.rev,releasedAt:b.releasedAt,prototype:true}));v.releaseHistory??=[];v.releaseHistory.push(snapshot);v.snapshot=snapshot;v.published=true;v.releasedBuild=b.n;v.releasedAt=b.releasedAt;record(v.platform+' '+v.name+' 从全局制品管理发布 build '+b.n+'（模拟）');render();toast('已模拟发布 build '+b.n+'，未分发真实制品')}
const renderBeforeArtifactManagement=render;
render=function(){ensureArtifactMetadata();renderBeforeArtifactManagement();const nav=document.querySelector('.sidebar .nav');if(nav&&!nav.querySelector('[data-artifact-action="home"]'))nav.insertAdjacentHTML('beforeend','<button data-artifact-action="home" class="'+(vs.page==='artifacts'?'active':'')+'"><span class="nav-icon" aria-hidden="true">'+sidebarIcon('package')+'</span><span class="nav-text">制品管理</span></button>');const docMatch=location.hash.match(/^#\/api-docs\/([^/]+)\/build\/(\d+)\/(\d+)$/),webMatch=location.hash.match(/^#\/artifact-preview\/([^/]+)\/build\/(\d+)$/);if(docMatch){const hit=artifactLookup(decodeURIComponent(docMatch[1]),Number(docMatch[2]));document.querySelector('.content').innerHTML=hit?apiDocPage(hit.v,hit.b,docMatch[3]):'<div class="empty">未找到 API 文档。</div>';document.querySelector('.topbar').innerHTML='<strong>API 文档</strong><span class="badge gray">独立页面 · 模拟</span>';return}if(webMatch){const hit=artifactLookup(decodeURIComponent(webMatch[1]),Number(webMatch[2]));document.querySelector('.content').innerHTML=hit?artifactWebPreviewPage(hit.v,hit.b):'<div class="empty">未找到 Web 候选包。</div>';document.querySelector('.topbar').innerHTML='<strong>候选包在线体验</strong><span class="badge gray">Web Preview · 模拟</span>';return}if(vs.page==='artifacts'&&!location.hash.startsWith('#/test-runs/')){document.querySelector('.content').innerHTML=artifactPage();document.querySelector('.topbar').innerHTML='<strong>交付中心 / 制品管理</strong><span class="badge gray">系统构建 · 模拟数据</span>';const match=location.hash.match(/^#\/artifacts\/([^/]+)\/build\/(\d+)$/);if(match)requestAnimationFrame(()=>openArtifactDrawer(decodeURIComponent(match[1]),Number(match[2]),false))}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-artifact-action]');if(!b)return;const d=b.dataset;
 if('publishCandidate'in d){ensureArtifactMetadata();const v=V(),build=v.builds.find(x=>x.n===Number(d.publishCandidate));if(v.published||!build||build.buildStatus!=='成功'||!['已生成','无需文档'].includes(artifactDocState(build))){e.preventDefault();e.stopImmediatePropagation();toast(v.published?'版本已发布':build?.buildStatus!=='成功'?'构建尚未完成，不能发布':'API 文档尚未生成成功，不能发布');return}}
 if(!d.artifactAction)return;e.preventDefault();e.stopImmediatePropagation();const action=d.artifactAction;
 if(action==='home'){removeArtifactDrawer(false);vs.page='artifacts';history.replaceState(null,'','#/artifacts');render();return}
 if(action==='filter'){artifactUI.query=$('#artifact-query').value.trim();artifactUI.line=$('#artifact-line').value;artifactUI.platform=$('#artifact-platform').value;artifactUI.service=$('#artifact-service').value;artifactUI.version=$('#artifact-version').value;artifactUI.status=$('#artifact-status').value;render();return}
 if(action==='close'){removeArtifactDrawer();return}const hit=artifactLookup(d.version,d.build);
 if(action==='detail'&&hit){openArtifactDrawer(hit.v.id,hit.b.n);return}
 if(action==='advance-build'&&hit){removeArtifactDrawer(false);advanceBuildProgress(hit.v,hit.b);return}
 if(action==='doc'&&hit){apiDocPreview(hit.v,hit.b,d.doc);return}
 if(action==='test'&&hit){removeArtifactDrawer(false);vs.version=hit.v.id;vs.build=hit.b.n;openResourceRunDialog(null,hit.b.n);return}
 if(action==='publish'&&hit){removeArtifactDrawer(false);publishGlobalArtifact(hit.v,hit.b);return}
 if(action==='version'){removeArtifactDrawer(false);const v=versions.find(v=>v.id===d.version);if(!v)return;vs.version=v.id;vs.page='version';vs.tab='制品管理';vs.build=v.builds.at(-1)?.n;history.replaceState(null,'','#/versions/'+v.id+'/artifacts');render()}
},true);
function artifactRoute(){if(location.hash.startsWith('#/api-docs/')||location.hash.startsWith('#/artifact-preview/')){vs.page='artifact-view';render();return}if(location.hash.startsWith('#/artifacts')){vs.page='artifacts';render();return}const match=location.hash.match(/^#\/versions\/([^/]+)\/artifacts$/);if(!match)return;const v=versions.find(v=>v.id===decodeURIComponent(match[1]));if(!v)return;vs.version=v.id;vs.page='version';vs.tab='制品管理';vs.build=v.builds.at(-1)?.n;render()}
window.addEventListener('hashchange',artifactRoute);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.artifact-drawer'))removeArtifactDrawer()});
if(location.hash.startsWith('#/api-docs/')||location.hash.startsWith('#/artifact-preview/'))vs.page='artifact-view';else if(location.hash.startsWith('#/artifacts'))vs.page='artifacts';else{const artifactVersion=location.hash.match(/^#\/versions\/([^/]+)\/artifacts$/);if(artifactVersion&&versions.some(v=>v.id===decodeURIComponent(artifactVersion[1]))){vs.version=decodeURIComponent(artifactVersion[1]);vs.page='version';vs.tab='制品管理';vs.build=V().builds.at(-1)?.n}}
render();
</script>

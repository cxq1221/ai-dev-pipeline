# Keep the official SDK agent loop and persistence, but use Harness's one-shot
# Bash tool. The shipped persistent PTY can wait for its second command here.
- id: persistent-bash
  disabled: true
- id: terminal-bash
  disabled: true
- id: pty
  disabled: true
- insert:
    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000
    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'
    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'

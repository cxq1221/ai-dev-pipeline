<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Agent 统一调度网关与 SDK Runner 架构 V7</title>
  <desc id="desc">统一调度网关位于控制面，主执行 Agent 位于异构机器池并调用 LLM，执行能力通过一条总线分发，SDK Runner 位于目标应用运行时。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFE"/><stop offset="1" stop-color="#EEF3FA"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7657E8"/><stop offset="1" stop-color="#5840C7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#20314D" flood-opacity="0.09"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3974D8"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#684BD5"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8290A7"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:30px;font-weight:760;fill:#17233B}.subtitle{font-size:15px;fill:#64728A}
      .layer{font-size:14px;font-weight:750;fill:#526078;letter-spacing:1px}.h{font-size:17px;font-weight:720;fill:#20314D}
      .p{font-size:14px;fill:#53627A}.small{font-size:12px;fill:#758298}.whiteH{font-size:19px;font-weight:750;fill:#FFF}
      .whiteP{font-size:13px;fill:#EEEAFE}.edge{font-size:12px;font-weight:650;fill:#53627A}.footH{font-size:13px;font-weight:700;fill:#B8C6DB}.footP{font-size:14px;fill:#FFF}
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <circle cx="1500" cy="70" r="170" fill="#DDE8FA" opacity=".46"/><circle cx="60" cy="1010" r="210" fill="#E4E0FA" opacity=".38"/>
  <text x="70" y="58" class="title">Agent 统一调度网关与 SDK Runner 架构</text>
  <text x="70" y="87" class="subtitle">统一网关协调对话、上下文与机器调度；主执行 Agent 在机器端调用 LLM 完成开发闭环</text>

  <!-- 01 Control plane -->
  <rect x="55" y="118" width="1490" height="228" rx="24" fill="#FFF" stroke="#D8E2F0" filter="url(#shadow)"/>
  <text x="82" y="151" class="layer">01 · 统一对话与 AGENT 调度控制面</text>

  <rect x="90" y="181" width="255" height="118" rx="18" fill="#EDF5FF" stroke="#AFCBF4"/>
  <circle cx="121" cy="213" r="14" fill="#3974D8"/><path d="M115 211h12M115 216h8" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <text x="147" y="220" class="h">统一 AI 对话</text>
  <text x="113" y="252" class="p">需求澄清 · 执行追问</text><text x="113" y="277" class="p">进度 · 风险 · 结果</text>

  <rect x="390" y="165" width="720" height="152" rx="20" fill="url(#violet)"/>
  <circle cx="425" cy="201" r="16" fill="#FFF" opacity=".17"/><path d="M417 201h16M425 193v16" stroke="#FFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="458" y="208" class="whiteH">Agent 统一调度网关</text>
  <text x="420" y="237" class="whiteP">会话关联 · 上下文组装 · 意图路由 · 执行状态协调 · 证据关联</text>
  <text x="420" y="263" class="whiteP">能力匹配 · 选机 · 排队 · 任务租约 · 故障切换</text>
  <rect x="420" y="281" width="660" height="24" rx="12" fill="#FFF" opacity=".13"/><text x="626" y="298" class="whiteP">自身不直接调用 LLM · 统一协调机器端执行</text>

  <rect x="1155" y="181" width="350" height="118" rx="18" fill="#F3F6FA" stroke="#CBD5E2"/>
  <circle cx="1188" cy="213" r="14" fill="#68778F"/><path d="M1182 213l4 4 8-9" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1215" y="220" class="h">任务状态与证据</text>
  <text x="1180" y="252" class="p">事件 · 日志 · 测试 · 产物</text><text x="1180" y="277" class="p">执行快照 · 全过程关联</text>

  <path d="M345 240H390" stroke="#3974D8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1110 240H1155" stroke="#8290A7" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Main control/return, vertically aligned -->
  <path d="M732 317V426" stroke="#3974D8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M768 426V317" stroke="#8290A7" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="490" y="354" width="230" height="26" rx="13" fill="#EAF2FF"/><text x="512" y="372" class="edge">任务租约 · 执行快照 ↓</text>
  <rect x="780" y="354" width="270" height="26" rx="13" fill="#F2F5F9"/><text x="800" y="372" class="edge">↑ 追问 · 进度 · 风险 · 结果</text>

  <!-- 02 Machine pool -->
  <rect x="55" y="390" width="1490" height="484" rx="24" fill="#FFF" stroke="#D8E2F0" filter="url(#shadow)"/>
  <text x="82" y="424" class="layer">02 · 异构执行机器池 · PC / macOS / Linux</text>

  <rect x="490" y="446" width="520" height="112" rx="21" fill="url(#violet)"/>
  <circle cx="532" cy="486" r="19" fill="#FFF" opacity=".17"/><path d="M524 486h16M532 478v16" stroke="#FFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="568" y="484" class="whiteH">主执行 Agent</text>
  <text x="516" y="518" class="whiteP">机器端调用 LLM · 拆解任务 · 选择工具 · 协调执行</text>
  <text x="516" y="542" class="whiteP">形成「计划 → 执行 → 验证」闭环</text>

  <!-- Execution capability group and a single clean bus -->
  <rect x="90" y="606" width="930" height="226" rx="20" fill="#F9FBFD" stroke="#D8E2F0"/>
  <text x="116" y="637" class="layer">执行能力</text>
  <path d="M750 558V626H205M750 626H905" fill="none" stroke="#684BD5" stroke-width="3"/>
  <circle cx="205" cy="626" r="4" fill="#684BD5"/><circle cx="438" cy="626" r="4" fill="#684BD5"/><circle cx="672" cy="626" r="4" fill="#684BD5"/><circle cx="905" cy="626" r="4" fill="#684BD5"/>
  <path d="M205 626V653M438 626V653M672 626V653M905 626V653" stroke="#684BD5" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <rect x="115" y="653" width="180" height="102" rx="16" fill="#EAF9F2" stroke="#9FD9BE"/><text x="139" y="690" class="h">任务编排</text><text x="139" y="718" class="p">计划 · 依赖 · 重试</text>
  <rect x="348" y="653" width="180" height="102" rx="16" fill="#EAF9F2" stroke="#9FD9BE"/><text x="372" y="690" class="h">代码开发</text><text x="372" y="718" class="p">读写代码 · Git · PR</text>
  <rect x="582" y="653" width="180" height="102" rx="16" fill="#EAF9F2" stroke="#9FD9BE"/><text x="606" y="690" class="h">构建与测试</text><text x="606" y="718" class="p">单测 · 集成 · 诊断</text>
  <rect x="815" y="653" width="180" height="102" rx="16" fill="#EAF9F2" stroke="#9FD9BE"/><text x="839" y="683" class="h">控制 App</text><text x="839" y="708" class="p">浏览器 · IDE · 桌面 UI</text><text x="839" y="732" class="small">触控 · USB · 外设 / HID</text>

  <rect x="115" y="778" width="880" height="36" rx="12" fill="#EEF2F7" stroke="#CBD5E2"/>
  <text x="140" y="801" class="p">本机工具与操作系统　Shell · Git · 编译器 · 测试框架 · UI 自动化 · 文件系统</text>

  <!-- Target runtime -->
  <rect x="1115" y="446" width="390" height="386" rx="20" fill="#F9FAFD" stroke="#CBD5E2"/>
  <text x="1140" y="477" class="layer">目标 APP / SDK 运行时</text><text x="1140" y="497" class="small">随执行机器部署</text>
  <rect x="1145" y="518" width="330" height="66" rx="15" fill="#F3F6FA" stroke="#CBD5E2"/><text x="1170" y="545" class="h">目标 App / Demo / 游戏</text><text x="1170" y="568" class="p">真实用户流程与运行环境</text>
  <path d="M1310 584V604" stroke="#8290A7" stroke-width="2" marker-end="url(#arrowGray)"/>
  <rect x="1145" y="604" width="330" height="198" rx="18" fill="#F7F4FF" stroke="#BEB1F1"/>
  <text x="1170" y="635" class="h">预置 SDK</text>
  <rect x="1170" y="650" width="280" height="78" rx="16" fill="url(#violet)"/><text x="1196" y="681" class="whiteH">SDK Runner</text><text x="1196" y="707" class="whiteP">轻量 · 受限 · 可观测</text>
  <path d="M1310 728V744" stroke="#684BD5" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <rect x="1170" y="744" width="280" height="39" rx="12" fill="#E7F7EF" stroke="#9FD9BE"/><text x="1212" y="769" class="p">SDK / 设备能力白名单</text>

  <!-- SDK protocol lane: confined to the whitespace between groups -->
  <path d="M1010 486H1060V671H1170" fill="none" stroke="#684BD5" stroke-width="3.5" marker-end="url(#arrowPurple)"/>
  <path d="M1170 710H1040V530H1010" fill="none" stroke="#8290A7" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="1028" y="579" width="115" height="46" rx="12" fill="#EEE9FF"/><text x="1045" y="598" class="edge">受控指令 →</text><text x="1045" y="616" class="small">版本化协议</text>
  <rect x="1028" y="733" width="115" height="46" rx="12" fill="#F2F5F9"/><text x="1044" y="752" class="edge">← 状态事件</text><text x="1044" y="770" class="small">诊断证据</text>

  <!-- Footer -->
  <rect x="55" y="910" width="1490" height="84" rx="20" fill="#17233B"/>
  <text x="85" y="941" class="footH">职责边界</text>
  <text x="85" y="971" class="footP">网关：会话与上下文协调</text><circle cx="387" cy="966" r="4" fill="#6F85A6"/>
  <text x="412" y="971" class="footP">网关：能力匹配、选机与租约</text><circle cx="776" cy="966" r="4" fill="#6F85A6"/>
  <text x="801" y="971" class="footP">主 Agent：调用 LLM 执行与验证</text><circle cx="1194" cy="966" r="4" fill="#6F85A6"/>
  <text x="1219" y="971" class="footP">SDK Runner：受限执行与回传</text>
</svg>

an></div><p class="small" style="margin:12px 0">'+(r.proposal?'已分析需求：建议修改 Demo 启动页的提示组件，并补充 80ms / 81ms 边界检查。':'可根据当前需求生成一次待确认的代码修改建议。')+'</p>'+(r.proposal?'<div class="notice">预计修改 <code>demo/src/.../NetworkHint.kt</code> · +24 / −3 行；由用户确认后生成提交。</div>':'')+'<div class="row" style="margin-top:13px"><button data-action="propose">AI 分析并提出修改</button><button data-action="commit" class="primary" '+(r.proposal?'':'disabled')+'>确认修改并记录提交</button></div><p class="small" style="margin:12px 0 0">提交后到“制品管理”构建候选包。</p></div></div>'+preview(r)+'</div>'}

function development(r){const session=r.sessions.find(s=>s.id===r.activeSession)||r.sessions[0],messages=r.messages.filter(m=>m.session===r.activeSession);return `<div class="dev-layout"><aside class="dev-sessions"><h3>需求会话</h3><button data-action="new-session">＋ 新会话</button><p class="session-note muted">独立对话 · 共用需求说明</p>${r.sessions.map(s=>`<button data-session="${s.id}" class="${r.activeSession===s.id?'active':''}"><strong>${escapeHtml(s.title)}</strong><small>${r.messages.filter(m=>m.session===s.id&&m.by==='user').length} 条消息</small></button>`).join('')}</aside><section class="dev-center"><details class="dev-disclosure" ${r.specCollapsed?'':'open'}><summary><strong>${escapeHtml(r.title)}</strong><span class="badge gray">SPEC v${r.specRev} · ${messages.length?'已记录对话调整':'需求说明'}</span><span class="disclosure-open">展开需求 ↓</span><span class="disclosure-close">收起需求 ↑</span></summary><div class="dev-spec"><div class="eyebrow">${r.id} → ${r.taskId} → SPEC v${r.specRev}</div><div class="row between"><h2>01 · 用户原始需求</h2>${statusBadge(status(r))}</div><div class="quote">${escapeHtml(r.desc)}</div><p class="muted" style="margin-top:12px">来源：统一需求池 / ${r.id}。需求说明、开发对话、提交和验收记录均关联当前需求。</p><h3>02 · 转换后的详细需求</h3><p><strong>业务目标与使用场景：</strong>用户在启动游戏前了解当前网络状况，预判可能的延迟体验。提示帮助用户决策，不阻断启动。</p><p><strong>范围与约束：</strong>目标平台：Android SDK Demo；本次修改启动页提示与交互，复用现有延迟来源。SDK 核心、计费与鉴权保持不变。</p><p><strong>行为规则：</strong><br>① 延迟 &gt; 80ms：显示弱网提示。<br>② 延迟 ≤ 80ms：不显示提示。<br>③ 提示出现后仍允许继续进入。</p><p><strong>异常与边界：</strong>80ms 与 81ms 分别验证；无有效延迟数据、网络恢复时机可在对话中补充。</p><h3>交互原型与辅助说明</h3><p class="muted">使用右侧运行预览确认提示状态，线框用于确认需求，不代表候选包已通过测试。</p><div class="quote"><strong>准备进入云游戏</strong><br>网络状态预检 · 延迟 ${r.latency}ms<br><span class="badge ${r.latency>80?'amber':'gray'}">${r.latency>80?'当前网络可能影响体验':'当前网络正常'}</span></div><h3>03 · 核心验收用例</h3><div class="line"><span>正常网络 · 24ms / 80ms</span><strong>不显示弱网提示</strong></div><div class="line"><span>弱网边界 · 81ms / 126ms</span><strong>提示可见，仍可继续进入</strong></div></div></details document.addEventListener('click',e=>{const target=e.target.closest('[data-preview-mode],[data-action]');if(!target)return;if(target.dataset.previewMode){ui.previewMode=target.dataset.previewMode;render();return}const action=target.dataset.action;if(action==='dev-upload'){$('#development-file').click();return}if(action==='dev-link'){modal('添加参考链接','<div class="field"><label for="dev-link-input">链接地址</label><input id="dev-link-input" type="url" placeholder="https://example.com/design"></div>','<button data-action="close">取消</button><button class="primary" data-action="save-dev-link">添加</button>');return}if(action==='save-dev-link'){const input=$('#dev-link-input'),raw=input.value.trim();try{const url=new URL(raw);if(!['http:','https:'].includes(url.protocol))throw Error();R().messages.push({by:'user',text:'添加参考链接：'+url.href,session:R().activeSession});$('#modal').close();render();toast('参考链接已加入当前需求对话（模拟）')}catch{toast('请输入有效的 http 或 https 链接')}return}if(action==='dev-assets'){toast('资产引用入口已打开（演示数据）');return}if(action==='view-request'){const details=document.querySelector('.dev-disclosure');if(details){details.open=true;details.scrollIntoView({behavior:'smooth',block:'start'})}return}if(action==='dev-send'){const r=R(),session=r.sessions.find(s=>s.id===r.activeSession)||r.sessions[0],input=$('#discussion-input'),message=input.value.trim(),mode=$('#dev-mode').value;if(!message&&mode!=='develop'){toast('请先输入要补充的需求');return}session.mode=mode;session.draft='';if(message)r.messages.push({by:'user',text:message,session:r.activeSession});if(mode==='develop'){r.proposal={createdAt:now()};r.state='开发中';r.messages.push({by:'ai',text:'已根据当前需求生成一项待确认修改建议。请检查改动摘要并确认提交。',session:r.activeSession})}else{if(message){r.specRev++;r.updatedAt=new Date().toISOString()}r.messages.push({by:'ai',text:'已记录补充内容，并关联到当前需求说明。你可以继续讨论，或切换到开发模式生成修改建议。',session:r.activeSession})}render();return}if(action==='preview-reload'){toast('已重新加载预览环境（模拟）');return}if(action==='preview-new-window'||action==='preview-fullscreen'){toast('预览窗口操作已触发（模拟）');return}if(action==='preview-stop'){toast('预览已停止（模拟），点击重新加载可恢复');return}if(action==='preview-ops'){toast('演示操作：选择网络延迟后观察弱网提示变化');return}},true);
